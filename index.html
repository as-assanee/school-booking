    async function saveResourceSubmit(resourceType) {
      let data = {};
      if (resourceType === 'room') {
        data = {
          Room_ID: document.getElementById('resId').value,
          Room_Name: document.getElementById('resName').value.trim(),
          Building: document.getElementById('resBuilding').value.trim(),
          Capacity: document.getElementById('resCapacity').value,
          Amenities: document.getElementById('resAmenities').value.trim(),
          Status: document.getElementById('resStatus').value
        };
      } else if (resourceType === 'vehicle') {
        data = {
          Vehicle_ID: document.getElementById('resId').value,
          Vehicle_Name: document.getElementById('resName').value.trim(),
          Plate_Number: document.getElementById('resPlate').value.trim(),
          Vehicle_Type: document.getElementById('resVType').value.trim(),
          Seats: document.getElementById('resSeats').value,
          Status: document.getElementById('resStatus').value
        };
      } else if (resourceType === 'driver') {
        data = {
          Driver_ID: document.getElementById('resId').value,
          Driver_Name: document.getElementById('resName').value.trim(),
          Phone: document.getElementById('resPhone').value.trim(),
          Line_User_ID: document.getElementById('resLineId').value.trim(),
          Status: document.getElementById('resStatus').value
        };
      }

      closeModal();
      showToast('กำลังบันทึกข้อมูล...', 'info');
      try {
        const res = await apiPost({
          action: 'saveResource',
          userId: state.user.userId,
          resourceType,
          data
        });
        if (res.status === 'success') {
          showToast(res.message, 'success');
          await loadWorkspaceData(false);
        } else {
          showToast(res.message || 'บันทึกไม่สำเร็จ', 'error');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      }
    }

          </div>
          <div class="space-y-2.5">
            ${state.users.map(u => `
              <div class="p-3.5 rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <p class="font-bold text-sm text-slate-900">${esc(u.fullName)}</p>
                  <p class="text-xs text-slate-500">${esc(u.position)} • ${esc(u.department)} (${esc(u.phone)})</p>
                </div>
                <select onchange="changeUserRole('${u.userId}', this.value)"
                  class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold bg-slate-50 text-slate-800 outline-none">
                  <option value="Teacher" ${u.role === 'Teacher' ? 'selected' : ''}>ครู/บุคลากร (Teacher)</option>
                  <option value="Approver" ${u.role === 'Approver' ? 'selected' : ''}>ผู้อนุมัติ (Approver)</option>
                  <option value="AV_Staff" ${u.role === 'AV_Staff' ? 'selected' : ''}>จนท.โสตฯ (AV_Staff)</option>
                  <option value="Driver" ${u.role === 'Driver' ? 'selected' : ''}>พนักงานขับรถ (Driver)</option>
                  <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>ผู้ดูแลระบบ (Admin)</option>
                </select>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function changeUserRole(targetUserId, newRole) {
      showToast('กำลังอัปเดตสิทธิ์...', 'info');
      try {
        const res = await apiPost({
          action: 'updateUserRole',
          userId: state.user.userId,
          targetUserId,
          newRole
        });
        if (res.status === 'success') {
          showToast(res.message, 'success');
          await loadWorkspaceData(false);
        } else {
          showToast(res.message || 'อัปเดตไม่สำเร็จ', 'error');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      }
    }

    // Boot application
    initApp();
  </script>
</body>
</html>
