<!DOCTYPE html>
<html lang="th">
<head>

  <!-- Fonts: Prompt (UI) & Sarabun (เอกสารราชการ) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
            doc: ['Sarabun', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->

  <!-- LINE LIFF SDK -->

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .glass-nav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .fade-in {
      animation: fadeIn 0.22s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Print Styling สำหรับพิมพ์ใบขออนุญาตแบบราชการ A4 */
    #printArea {
      display: none;
    }
    @media print {
      @page { size: A4 portrait; margin: 1.5cm; }
      body { background: #ffffff !important; }
      #appRoot, #toastContainer, #modalOverlay { display: none !important; }
      #printArea {
        display: block !important;
        font-family: 'Sarabun', sans-serif !important;
        color: #000000 !important;
        font-size: 16px;
        line-height: 1.65;
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900">

  <!-- ====================================================================== -->
  <!-- ROOT APPLICATION CONTAINER                                             -->
  <!-- ====================================================================== -->
  <div id="appRoot" class="min-h-screen flex flex-col md:flex-row">

    <!-- LOADING SPLASH SCREEN -->

            <input type="text" id="regFullName" required placeholder="เช่น นายอัสนี รัตนชัย"

              <option>ฝ่ายบริหาร</option>

              <option>กลุ่มบริหารงานบุคคล</option>
              <option>กลุ่มบริหารงานงบประมาณ</option>
              <option>กลุ่มบริหารงานทั่วไป / อาคารสถานที่</option>
              <option>ภาษาไทย</option>
              <option>คณิตศาสตร์</option>
              <option>วิทยาศาสตร์และเทคโนโลยี</option>
              <option>สังคมศึกษา ศาสนา และวัฒนธรรม</option>
              <option>สุขศึกษาและพลศึกษา</option>
              <option>ศิลปะ</option>
              <option>การงานอาชีพ</option>
              <option>ภาษาต่างประเทศ</option>

          <button type="submit" id="regSubmitBtn"

            ยืนยันการลงทะเบียนและเข้าใช้งาน

    <!-- ==================================================================== -->
    <!-- DESKTOP LEFT SIDEBAR                                                 -->
    <!-- ==================================================================== -->
    <aside id="desktopSidebar" class="hidden md:flex md:flex-col md:w-64 lg:w-72 bg-white border-r border-slate-200/80 shrink-0 sticky top-0 h-screen z-20">
      <div class="p-5 border-b border-slate-100 flex items-center gap-3">

        </div>
        <div class="min-w-0">

      <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="sidebarNav"></nav>

      <!-- User Profile Card -->

    <!-- ==================================================================== -->
    <!-- MAIN WORKSPACE                                                       -->

    <div id="mainShell" class="hidden flex-1 flex flex-col min-w-0 pb-20 md:pb-6">

      <!-- TOP HEADER -->

        <div class="flex items-center gap-2 shrink-0">

    <!-- ==================================================================== -->

    <!-- ==================================================================== -->
    <nav id="mobileBottomNav" class="hidden md:hidden fixed bottom-0 inset-x-0 z-30 glass-nav border-t border-slate-200/80 px-2 py-1.5 shadow-[0_-4px_20px_rgba(15,23,42,0.06)]">

  <!-- ====================================================================== -->

  <!-- ====================================================================== -->

  <!-- ====================================================================== -->
  <div id="printArea"></div>

  <!-- ====================================================================== -->
  <!-- APPLICATION JAVASCRIPT                                                 -->
  <!-- ====================================================================== -->
  <script>
    // ========================================================================
    // 1. ตั้งค่าการเชื่อมต่อระบบจริง (โรงเรียนจะนะชนูปถัมภ์)
    // ========================================================================
    const APP_CONFIG = {
      SCHOOL_NAME: 'โรงเรียนจะนะชนูปถัมภ์',
      LIFF_ID: '2012824375-7JdM4XJD',
      GAS_WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbzeCtbrGugMQb83JqL3Im6fApPEH6gewqAFR4l6rPX4NUIulGT1XtbMf6MWzvylfrFH/exec'
    };

    // ========================================================================
    // 2. APPLICATION STATE
    // ========================================================================
    const state = {
      activeTab: 'dashboard',
      dashboardType: 'room', // 'room' | 'vehicle'
      dashboardViewMode: 'calendar', // 'calendar' | 'list'
      dashboardDateFilter: 'all', // 'today' | 'tomorrow' | 'all' | 'custom'
      dashboardCustomDate: getTodayYMD(),
      calendarYear: new Date().getFullYear(),
      calendarMonth: new Date().getMonth(),
      calendarSelectedDate: getTodayYMD(),
      calendarResourceFilter: 'ALL',
      myBookingTab: 'upcoming', // 'upcoming' | 'history'
      myBookingTypeFilter: 'ALL',
      approvalTab: 'pending', // 'pending' | 'history'
      adminTab: 'rooms', // 'rooms' | 'vehicles' | 'drivers' | 'users'
      lineProfile: {
        userId: '',
        displayName: '',
        pictureUrl: ''
      },
      user: null,
      rooms: [],
      vehicles: [],
      drivers: [],
      roomBookings: [],
      vehicleBookings: [],
      users: [],
      roomForm: {
        roomId: '',
        bookingDate: getTodayYMD(),
        startTime: '08:30',
        endTime: '12:00',
        title: '',
        attendees: 30,
        seatingStyle: 'ปกติ',
        equipment: ['เครื่องเสียง / ไมโครโฟน'],
        note: ''
      },
      vehicleForm: {
        vehicleId: '',
        startDate: getTodayYMD(),
        startTime: '08:00',
        endDate: getTodayYMD(),
        endTime: '16:30',
        purpose: '',
        destination: '',
        province: 'สงขลา',
        docRef: '',
        teacherCount: 2,
        studentCount: 10,
        driverId: 'AUTO',
        note: ''
      },
      isSubmitting: false
    };

    // ========================================================================
    // 3. DATE & UTILITY HELPERS
    // ========================================================================
    function getTodayYMD() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTomorrowYMD() {
      const tmr = new Date();
      tmr.setDate(tmr.getDate() + 1);
      const y = tmr.getFullYear();
      const m = String(tmr.getMonth() + 1).padStart(2, '0');
      const d = String(tmr.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatThaiDateShort(ymd) {
      if (!ymd) return '-';
      const p = String(ymd).split('-');
      if (p.length !== 3) return ymd;
      const months = ['', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      return `${Number(p[2])} ${months[Number(p[1])]} ${Number(p[0]) + 543}`;
    }

    function formatThaiDateFull(ymd) {
      if (!ymd) return '-';
      const p = String(ymd).split('-');
      if (p.length !== 3) return ymd;
      const months = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      return `${Number(p[2])} ${months[Number(p[1])]} พ.ศ. ${Number(p[0]) + 543}`;
    }

    function toTimestamp(dateStr, timeStr) {
      const p = String(dateStr).split('-');
      const t = String(timeStr).split(':');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), Number(t[0]), Number(t[1] || 0), 0).getTime();
    }

    function isTimeOverlap(startA, endA, startB, endB) {
      return startA < endB && endA > startB;
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-circle',
        warning: 'alert-triangle',
        info: 'info'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl shadow-lg border text-xs sm:text-sm font-medium fade-in ${styles[type] || styles.info}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i>
        <span class="flex-1 leading-snug">${esc(message)}</span>
      `;
      container.appendChild(el);
      lucide.createIcons();
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 3600);
    }

    function openModal(html) {
      const overlay = document.getElementById('modalOverlay');
      const box = document.getElementById('modalBox');
      box.innerHTML = html;
      overlay.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    });

    // ========================================================================
    // 4. API COMMUNICATION (GAS WEB APP)
    // ========================================================================
    async function apiGet(params) {
      const url = new URL(APP_CONFIG.GAS_WEB_APP_URL);
      Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
      const res = await fetch(url.toString(), { method: 'GET' });
      return await res.json();
    }

    async function apiPost(payload) {
      const res = await fetch(APP_CONFIG.GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    // ========================================================================
    // 5. INITIALIZATION & LINE LIFF AUTH
    // ========================================================================
    async function initApp() {
      try {
        document.getElementById('loadingSubtext').textContent = 'กำลังเชื่อมต่อ LINE LIFF...';
        await liff.init({ liffId: APP_CONFIG.LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const profile = await liff.getProfile();
        state.lineProfile = {
          userId: profile.userId,
          displayName: profile.displayName || '',
          pictureUrl: profile.pictureUrl || ''
        };

        document.getElementById('loadingSubtext').textContent = 'กำลังตรวจสอบข้อมูลบุคลากร...';
        const checkRes = await apiGet({ action: 'checkUser', userId: state.lineProfile.userId });

        if (checkRes.status === 'success' && checkRes.isRegistered) {
          await loadWorkspaceData();
        } else {
          showRegisterScreen();
        }
      } catch (err) {
        console.error('LIFF/Init Error:', err);
        document.getElementById('loadingScreen').innerHTML = `
          <div class="max-w-sm bg-white p-6 rounded-3xl shadow-lg border border-slate-100 text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="wifi-off" class="w-6 h-6"></i>
            </div>
            <h3 class="font-bold text-slate-900">ไม่สามารถเชื่อมต่อระบบได้</h3>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
              กรุณาเปิดลิงก์ผ่านแอปพลิเคชัน <b>LINE</b> ของโรงเรียนจะนะชนูปถัมภ์ หรือตรวจสอบการเชื่อมต่ออินเทอร์เน็ต
            </p>
            <p class="text-[11px] text-slate-400 mt-2 break-all">${esc(err.message || err)}</p>
            <button onclick="location.reload()" class="mt-4 w-full py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold">
              ลองใหม่อีกครั้ง
            </button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function showRegisterScreen() {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('mainShell').classList.add('hidden');
      document.getElementById('mobileBottomNav').classList.add('hidden');
      document.getElementById('registerScreen').classList.remove('hidden');

      if (state.lineProfile.displayName) {
        document.getElementById('regLineNameText').textContent = `LINE: ${state.lineProfile.displayName}`;
      }
      lucide.createIcons();
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      const fullName = document.getElementById('regFullName').value.trim();
      const position = document.getElementById('regPosition').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const department = document.getElementById('regDepartment').value;

      if (!fullName || !department) {
        showToast('กรุณากรอกชื่อ-นามสกุล และเลือกกลุ่มสาระฯ/ฝ่ายงาน', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึกข้อมูล...`;
      lucide.createIcons();

      try {
        const res = await apiPost({
          action: 'registerUser',
          userId: state.lineProfile.userId,
          fullName,
          position,
          phone,
          department
        });

        if (res.status === 'success') {
          showToast('ลงทะเบียนเรียบร้อย ยินดีต้อนรับครับ!', 'success');
          document.getElementById('registerScreen').classList.add('hidden');
          document.getElementById('loadingScreen').classList.remove('hidden');
          document.getElementById('loadingSubtext').textContent = 'กำลังโหลดข้อมูลตารางการจอง...';
          await loadWorkspaceData();
        } else {
          showToast(res.message || 'เกิดข้อผิดพลาดในการลงทะเบียน', 'error');
        }
      } catch (err) {
        showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i> ยืนยันการลงทะเบียนและเข้าใช้งาน`;
        lucide.createIcons();
      }
    });

    async function loadWorkspaceData(showNotification = false) {
      const data = await apiGet({
        action: 'getBootstrapData',
        userId: state.lineProfile.userId
      });

      if (data.status === 'unregistered') {
        showRegisterScreen();
        return;
      }

      if (data.status !== 'success') {
        throw new Error(data.message || 'โหลดข้อมูลไม่สำเร็จ');
      }

      state.user = data.user;
      state.rooms = data.rooms || [];
      state.vehicles = data.vehicles || [];
      state.drivers = data.drivers || [];
      state.roomBookings = data.roomBookings || [];
      state.vehicleBookings = data.vehicleBookings || [];
      state.users = data.users || [];

      if (!state.roomForm.roomId) {
        const activeRoom = state.rooms.find(r => r.Status === 'Active');
        if (activeRoom) state.roomForm.roomId = activeRoom.Room_ID;
      }
      if (!state.vehicleForm.vehicleId) {
        const activeVeh = state.vehicles.find(v => v.Status === 'Active');
        if (activeVeh) state.vehicleForm.vehicleId = activeVeh.Vehicle_ID;
      }

      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('registerScreen').classList.add('hidden');
      document.getElementById('mainShell').classList.remove('hidden');
      document.getElementById('mobileBottomNav').classList.remove('hidden');

      updateUserProfileUI();
      renderNavigation();
      renderCurrentPage();

      if (showNotification) {
        showToast('อัปเดตข้อมูลล่าสุดเรียบร้อยแล้ว', 'success');
      }
    }

    async function refreshData(notify = false) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin');
      try {
        await loadWorkspaceData(notify);
      } catch (e) {
        showToast('รีเฟรชข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error');
      } finally {
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    function updateUserProfileUI() {
      const u = state.user;
      if (!u) return;
      const roleLabels = {
        Admin: 'ผู้ดูแลระบบ',
        Approver: 'ผู้อนุมัติ',
        Teacher: 'ครู/บุคลากร',
        AV_Staff: 'จนท.โสตฯ',
        Driver: 'พนักงานขับรถ'
      };
      document.getElementById('sidebarUserName').textContent = u.fullName;
      document.getElementById('sidebarUserRole').textContent = roleLabels[u.role] || u.role;
      document.getElementById('sidebarUserDept').textContent = u.department;
      document.getElementById('mobileUserSub').textContent = `${u.fullName} • ${roleLabels[u.role] || u.role}`;

      const avatarEl = document.getElementById('sidebarAvatar');
      if (state.lineProfile.pictureUrl) {
        avatarEl.innerHTML = `<img src="${esc(state.lineProfile.pictureUrl)}" alt="avatar" class="w-full h-full object-cover" />`;
      } else {
        avatarEl.textContent = u.fullName.charAt(0);
      }
    }

    // ========================================================================
    // 6. NAVIGATION MENU (ROLE-BASED)
    // ========================================================================
    function getMenuItems() {
      const role = state.user ? state.user.role : 'Teacher';
      const pendingRooms = state.roomBookings.filter(b => b.Status === 'Pending').length;
      const pendingVehicles = state.vehicleBookings.filter(b => b.Status === 'Pending').length;
      const totalPending = pendingRooms + pendingVehicles;

      const items = [
        { id: 'dashboard', label: 'ปฏิทิน/ภาพรวม', mobileLabel: 'ปฏิทิน', icon: 'calendar-days' },
        { id: 'book-room', label: 'จองห้องประชุม', mobileLabel: 'จองห้อง', icon: 'building-2' },
        { id: 'book-vehicle', label: 'จองรถราชการ', mobileLabel: 'จองรถ', icon: 'bus' },
        { id: 'my-bookings', label: 'รายการของฉัน', mobileLabel: 'ของฉัน', icon: 'clipboard-list' }
      ];

      if (role === 'Approver' || role === 'Admin') {
        items.push({
          id: 'approvals',
          label: 'อนุมัติคำขอ',
          mobileLabel: 'อนุมัติ',
          icon: 'check-square',
          badge: totalPending > 0 ? totalPending : null
        });
      }

      if (role === 'AV_Staff' || role === 'Driver' || role === 'Admin') {
        items.push({
          id: 'staff-queue',
          label: 'คิวงานปฏิบัติการ',
          mobileLabel: 'คิวงาน',
          icon: 'wrench'
        });
      }

      if (role === 'Admin') {
        items.push({
          id: 'admin',
          label: 'ตั้งค่าระบบ/สิทธิ์',
          mobileLabel: 'ตั้งค่า',
          icon: 'settings'
        });
      }

      return items;
    }

    function renderNavigation() {
      const items = getMenuItems();
      const sidebarNav = document.getElementById('sidebarNav');
      sidebarNav.innerHTML = items.map(item => {
        const active = state.activeTab === item.id;
        return `
          <button onclick="switchTab('${item.id}')"
            class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition ${
              active
                ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-200'
                : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
            }">
            <span class="flex items-center gap-3">
              <i data-lucide="${item.icon}" class="w-4 h-4"></i>
              <span>${item.label}</span>
            </span>
            ${item.badge ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${active ? 'bg-white text-indigo-700' : 'bg-amber-500 text-white'}">${item.badge}</span>` : ''}
          </button>
        `;
      }).join('');

      // Mobile Bottom Nav (แสดงสูงสุด 5 ปุ่มหลัก ถ้ามีมากกว่านั้นแสดงปุ่ม "เพิ่มเติม")
      const mobileGrid = document.getElementById('mobileNavGrid');
      const mobileItems = items.slice(0, 5);
      mobileGrid.style.gridTemplateColumns = `repeat(${mobileItems.length}, minmax(0, 1fr))`;

      mobileGrid.innerHTML = mobileItems.map(item => {
        const active = state.activeTab === item.id;
        return `
          <button onclick="switchTab('${item.id}')"
            class="relative flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition ${
              active ? 'text-indigo-600 bg-indigo-50/80 font-semibold' : 'text-slate-500 hover:text-slate-800'
            }">
            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 truncate max-w-full">${item.mobileLabel}</span>
            ${item.badge ? `<span class="absolute top-1 right-2.5 w-4 h-4 rounded-full bg-amber-500 text-white text-[9px] font-bold flex items-center justify-center">${item.badge}</span>` : ''}
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      renderNavigation();
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentPage() {
      const titles = {
        'dashboard': 'ปฏิทินและภาพรวมการใช้',
        'book-room': 'จองห้องประชุม',
        'book-vehicle': 'จองรถราชการ',
        'my-bookings': 'รายการจองของฉัน',
        'approvals': 'พิจารณาอนุมัติคำขอ',
        'staff-queue': 'ตารางปฏิบัติงานเจ้าหน้าที่',
        'admin': 'จัดการข้อมูลพื้นฐานและสิทธิ์'
      };
      document.getElementById('pageTitle').textContent = titles[state.activeTab] || 'ระบบจองโรงเรียน';

      const container = document.getElementById('pageContent');
      switch (state.activeTab) {
        case 'dashboard':
          container.innerHTML = renderDashboardPage();
          break;
        case 'book-room':
          container.innerHTML = renderBookRoomPage();
          break;
        case 'book-vehicle':
          container.innerHTML = renderBookVehiclePage();
          break;
        case 'my-bookings':
          container.innerHTML = renderMyBookingsPage();
          break;
        case 'approvals':
          container.innerHTML = renderApprovalsPage();
          break;
        case 'staff-queue':
          container.innerHTML = renderStaffQueuePage();
          break;
        case 'admin':
          container.innerHTML = renderAdminPage();
          break;
      }
      lucide.createIcons();
    }

    // ========================================================================
    // 7. PAGE 1: DASHBOARD & INTERACTIVE MONTHLY CALENDAR
    // ========================================================================
    function renderDashboardPage() {
      const todayYmd = getTodayYMD();
      const tmrYmd = getTomorrowYMD();
      const activeRoomsCount = state.rooms.filter(r => r.Status === 'Active').length;
      const activeVehiclesCount = state.vehicles.filter(v => v.Status === 'Active').length;
      const pendingCount = state.roomBookings.filter(b => b.Status === 'Pending').length +
                           state.vehicleBookings.filter(b => b.Status === 'Pending').length;
      const myUpcomingCount =
        state.roomBookings.filter(b => b.Requester_Line_ID === state.user.userId && b.Booking_Date >= todayYmd && b.Status !== 'Cancelled' && b.Status !== 'Rejected').length +
        state.vehicleBookings.filter(b => b.Requester_Line_ID === state.user.userId && b.End_Date >= todayYmd && b.Status !== 'Cancelled' && b.Status !== 'Rejected').length;

      const isPrivileged = state.user.role === 'Admin' || state.user.role === 'Approver';

      // สำหรับโหมดรายการ (List View)
      let filtered = [];
      if (state.dashboardType === 'room') {
        filtered = state.roomBookings.filter(b => {
          if (b.Status === 'Cancelled' || b.Status === 'Rejected') return false;
          if (state.dashboardDateFilter === 'today') return b.Booking_Date === todayYmd;
          if (state.dashboardDateFilter === 'tomorrow') return b.Booking_Date === tmrYmd;
          if (state.dashboardDateFilter === 'custom') return b.Booking_Date === state.dashboardCustomDate;
          return b.Booking_Date >= todayYmd;
        }).sort((a, b) => `${a.Booking_Date} ${a.Start_Time}`.localeCompare(`${b.Booking_Date} ${b.Start_Time}`));
      } else {
        filtered = state.vehicleBookings.filter(b => {
          if (b.Status === 'Cancelled' || b.Status === 'Rejected') return false;
          if (state.dashboardDateFilter === 'today') return b.Start_Date <= todayYmd && b.End_Date >= todayYmd;
          if (state.dashboardDateFilter === 'tomorrow') return b.Start_Date <= tmrYmd && b.End_Date >= tmrYmd;
          if (state.dashboardDateFilter === 'custom') return b.Start_Date <= state.dashboardCustomDate && b.End_Date >= state.dashboardCustomDate;
          return b.End_Date >= todayYmd;
        }).sort((a, b) => `${a.Start_Date} ${a.Start_Time}`.localeCompare(`${b.Start_Date} ${b.Start_Time}`));
      }

      return `
        <div class="space-y-6 fade-in">
          <!-- KPI Summary Cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div onclick="switchTab('book-room')" class="cursor-pointer bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:border-indigo-300 transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500">ห้องประชุมพร้อมใช้</span>
                <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                  <i data-lucide="building-2" class="w-4 h-4"></i>
                </div>
              </div>
              <p class="text-2xl font-bold text-slate-900 mt-2">${activeRoomsCount} <span class="text-xs font-normal text-slate-400">/ ${state.rooms.length} ห้อง</span></p>
              <p class="text-[11px] text-indigo-600 font-medium mt-1">+ กดจองห้องประชุม</p>
            </div>

            <div onclick="switchTab('book-vehicle')" class="cursor-pointer bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:border-sky-300 transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500">รถราชการพร้อมใช้</span>
                <div class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center">
                  <i data-lucide="bus" class="w-4 h-4"></i>
                </div>
              </div>
              <p class="text-2xl font-bold text-slate-900 mt-2">${activeVehiclesCount} <span class="text-xs font-normal text-slate-400">/ ${state.vehicles.length} คัน</span></p>
              <p class="text-[11px] text-sky-600 font-medium mt-1">+ กดจองรถราชการ</p>
            </div>

            <div onclick="switchTab('my-bookings')" class="cursor-pointer bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:border-emerald-300 transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500">รายการจองของฉัน</span>
                <div class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                  <i data-lucide="clipboard-check" class="w-4 h-4"></i>
                </div>
              </div>
              <p class="text-2xl font-bold text-slate-900 mt-2">${myUpcomingCount} <span class="text-xs font-normal text-slate-400">รายการ</span></p>
              <p class="text-[11px] text-emerald-600 font-medium mt-1">ดูรายละเอียด / พิมพ์ใบขอ</p>
            </div>

            <div ${isPrivileged ? `onclick="switchTab('approvals')"` : ''} class="${isPrivileged ? 'cursor-pointer hover:border-amber-300' : ''} bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-500">คำขอรออนุมัติ</span>
                <div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                  <i data-lucide="clock" class="w-4 h-4"></i>
                </div>
              </div>
              <p class="text-2xl font-bold text-slate-900 mt-2">${pendingCount} <span class="text-xs font-normal text-slate-400">รายการ</span></p>
              <p class="text-[11px] text-amber-600 font-medium mt-1">${isPrivileged ? 'กดเพื่อพิจารณาอนุมัติ →' : 'อยู่ระหว่างรอพิจารณา'}</p>
            </div>
          </div>

          <!-- Extra Quick Links for Mobile (ถ้ามีเมนูมากกว่า 5 รายการ) -->
          ${state.user.role === 'Admin' ? `
            <div class="md:hidden grid grid-cols-2 gap-2.5">
              <button onclick="switchTab('staff-queue')" class="bg-white border border-slate-200 rounded-2xl p-3 flex items-center gap-2.5 text-left shadow-sm">
                <div class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
                  <i data-lucide="wrench" class="w-4 h-4"></i>
                </div>
                <div>
                  <p class="text-xs font-bold text-slate-800">คิวงานเจ้าหน้าที่</p>
                  <p class="text-[10px] text-slate-500">โสตฯ & พนักงานขับรถ</p>
                </div>
              </button>
              <button onclick="switchTab('admin')" class="bg-white border border-slate-200 rounded-2xl p-3 flex items-center gap-2.5 text-left shadow-sm">
                <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                  <i data-lucide="settings" class="w-4 h-4"></i>
                </div>
                <div>
                  <p class="text-xs font-bold text-slate-800">ตั้งค่าระบบ</p>
                  <p class="text-[10px] text-slate-500">จัดการห้อง/รถ/สิทธิ์</p>
                </div>
              </button>
            </div>
          ` : ''}

          <!-- Schedule Explorer Section -->
          <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <!-- Switcher Room / Vehicle -->
              <div class="inline-flex p-1 rounded-xl bg-slate-100 self-start">
                <button onclick="setDashboardType('room')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${state.dashboardType === 'room' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  <i data-lucide="building-2" class="w-3.5 h-3.5"></i> ตารางห้องประชุม
                </button>
                <button onclick="setDashboardType('vehicle')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${state.dashboardType === 'vehicle' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  <i data-lucide="bus" class="w-3.5 h-3.5"></i> ตารางรถราชการ
                </button>
              </div>

              <!-- View Mode Switcher -->
              <div class="inline-flex p-1 rounded-xl bg-slate-100 self-start sm:self-auto">
                <button onclick="setDashboardViewMode('calendar')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${state.dashboardViewMode === 'calendar' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i> ปฏิทิน
                </button>
                <button onclick="setDashboardViewMode('list')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${state.dashboardViewMode === 'list' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  <i data-lucide="list" class="w-3.5 h-3.5"></i> รายการ
                </button>
              </div>
            </div>

            ${state.dashboardViewMode === 'calendar' ? renderDashboardCalendar() : `
              <div class="px-4 sm:px-5 pt-4 flex flex-wrap items-center gap-1.5">
                ${renderDateChip('today', 'วันนี้')}
                ${renderDateChip('tomorrow', 'พรุ่งนี้')}
                ${renderDateChip('all', 'กำลังจะมาถึงทั้งหมด')}
                <input type="date" value="${state.dashboardCustomDate}" onchange="setDashboardCustomDate(this.value)"
                  class="px-2.5 py-1 rounded-lg border ${state.dashboardDateFilter === 'custom' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-600'} text-xs outline-none cursor-pointer" />
              </div>

              <div class="p-4 sm:p-5">
                ${filtered.length === 0 ? `
                  <div class="text-center py-10">
                    <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                      <i data-lucide="calendar-x" class="w-6 h-6"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-600">ไม่มีรายการจองในช่วงเวลาที่เลือก</p>
                    <p class="text-xs text-slate-400 mt-1">ห้องและรถว่างพร้อมให้บริการ สามารถกดจองได้ทันที</p>
                  </div>
                ` : `
                  <div class="space-y-3">
                    ${filtered.map(b => renderScheduleCard(state.dashboardType, b)).join('')}
                  </div>
                `}
              </div>
            `}
          </div>

          <!-- Resource Status Overview -->
          <div>
            <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
              <i data-lucide="${state.dashboardType === 'room' ? 'door-open' : 'car'}" class="w-4 h-4 text-indigo-600"></i>
              สถานะ${state.dashboardType === 'room' ? 'ห้องประชุม' : 'รถราชการ'}ทั้งหมด
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              ${state.dashboardType === 'room'
                ? state.rooms.map(r => `
                  <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex items-start justify-between gap-2">
                        <span class="font-semibold text-sm text-slate-900">${esc(r.Room_Name)}</span>
                        ${resourceStatusBadge(r.Status)}
                      </div>
                      <p class="text-xs text-slate-500 mt-1">${esc(r.Building)} • จุ ${r.Capacity} คน</p>
                      <p class="text-[11px] text-slate-400 mt-2 line-clamp-2">${esc(r.Amenities)}</p>
                    </div>
                  </div>
                `).join('')
                : state.vehicles.map(v => `
                  <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex items-start justify-between gap-2">
                        <span class="font-semibold text-sm text-slate-900">${esc(v.Vehicle_Name)}</span>
                        ${resourceStatusBadge(v.Status)}
                      </div>
                      <p class="text-xs font-medium text-sky-700 mt-1">${esc(v.Plate_Number)}</p>
                      <p class="text-[11px] text-slate-500 mt-1">${esc(v.Vehicle_Type)} • ${v.Seats} ที่นั่ง</p>
                    </div>
                  </div>
                `).join('')
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderDateChip(id, label) {
      const active = state.dashboardDateFilter === id;
      return `<button onclick="setDashboardDateFilter('${id}')" class="px-3 py-1 rounded-lg text-xs font-medium transition ${
        active ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
      }">${label}</button>`;
    }

    function setDashboardType(t) { state.dashboardType = t; state.calendarResourceFilter = 'ALL'; renderCurrentPage(); }
    function setDashboardViewMode(mode) { state.dashboardViewMode = mode; renderCurrentPage(); }
    function setDashboardDateFilter(f) { state.dashboardDateFilter = f; renderCurrentPage(); }
    function setDashboardCustomDate(d) { state.dashboardCustomDate = d; state.dashboardDateFilter = 'custom'; renderCurrentPage(); }
    function setCalendarResourceFilter(val) { state.calendarResourceFilter = val; renderCurrentPage(); }

    function changeCalendarMonth(delta) {
      const d = new Date(state.calendarYear, state.calendarMonth + delta, 1);
      state.calendarYear = d.getFullYear();
      state.calendarMonth = d.getMonth();
      renderCurrentPage();
    }

    function goCalendarToday() {
      const now = new Date();
      state.calendarYear = now.getFullYear();
      state.calendarMonth = now.getMonth();
      state.calendarSelectedDate = getTodayYMD();
      renderCurrentPage();
    }

    function selectCalendarDate(ymd) {
      state.calendarSelectedDate = ymd;
      renderCurrentPage();
    }

    function quickBookFromDate(type, ymd) {
      if (type === 'room') {
        state.roomForm.bookingDate = ymd;
        if (state.calendarResourceFilter !== 'ALL') state.roomForm.roomId = state.calendarResourceFilter;
        switchTab('book-room');
      } else {
        state.vehicleForm.startDate = ymd;
        state.vehicleForm.endDate = ymd;
        if (state.calendarResourceFilter !== 'ALL') state.vehicleForm.vehicleId = state.calendarResourceFilter;
        switchTab('book-vehicle');
      }
    }

    function getBookingsForDate(type, ymd, resourceFilter = 'ALL') {
      if (type === 'room') {
        return state.roomBookings.filter(b => {
          if (b.Status === 'Cancelled' || b.Status === 'Rejected') return false;
          if (resourceFilter !== 'ALL' && b.Room_ID !== resourceFilter) return false;
          return b.Booking_Date === ymd;
        }).sort((a, b) => String(a.Start_Time).localeCompare(String(b.Start_Time)));
      }
      return state.vehicleBookings.filter(b => {
        if (b.Status === 'Cancelled' || b.Status === 'Rejected') return false;
        if (resourceFilter !== 'ALL' && b.Vehicle_ID !== resourceFilter) return false;
        return b.Start_Date <= ymd && b.End_Date >= ymd;
      }).sort((a, b) => String(a.Start_Time).localeCompare(String(b.Start_Time)));
    }

    function renderDashboardCalendar() {
      const isRoom = state.dashboardType === 'room';
      const year = state.calendarYear;
      const month = state.calendarMonth;
      const todayYmd = getTodayYMD();
      const selectedYmd = state.calendarSelectedDate;

      const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      const dayHeaders = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

      const resourceOptions = isRoom
        ? state.rooms.map(r => `<option value="${r.Room_ID}" ${state.calendarResourceFilter === r.Room_ID ? 'selected' : ''}>${esc(r.Room_Name)}</option>`).join('')
        : state.vehicles.map(v => `<option value="${v.Vehicle_ID}" ${state.calendarResourceFilter === v.Vehicle_ID ? 'selected' : ''}>${esc(v.Vehicle_Name)} (${esc(v.Plate_Number)})</option>`).join('');

      let cellsHtml = '';
      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - firstWeekday + 1;
        if (dayNum < 1 || dayNum > daysInMonth) {
          cellsHtml += `<div class="min-h-[60px] sm:min-h-[96px] bg-slate-50/60 border-b border-r border-slate-100"></div>`;
          continue;
        }

        const ymd = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        const bookings = getBookingsForDate(state.dashboardType, ymd, state.calendarResourceFilter);
        const isToday = ymd === todayYmd;
        const isSelected = ymd === selectedYmd;
        const isPast = ymd < todayYmd;
        const isWeekend = (i % 7 === 0 || i % 7 === 6);

        const approvedCount = bookings.filter(b => b.Status === 'Approved').length;
        const pendingCount = bookings.filter(b => b.Status === 'Pending').length;

        const desktopPills = bookings.slice(0, 2).map(b => {
          const pillStyle = b.Status === 'Pending'
            ? 'bg-amber-100 text-amber-800 border-amber-200'
            : (isRoom ? 'bg-indigo-100 text-indigo-800 border-indigo-200' : 'bg-sky-100 text-sky-800 border-sky-200');
          const label = isRoom ? `${b.Start_Time} ${b.Room_Name}` : `${b.Start_Time} ${b.Vehicle_Name}`;
          return `<div class="hidden sm:block truncate text-[10px] font-medium px-1.5 py-0.5 rounded border ${pillStyle}">${esc(label)}</div>`;
        }).join('');

        const morePill = bookings.length > 2
          ? `<div class="hidden sm:block text-[10px] font-semibold text-slate-500 px-1">+${bookings.length - 2} รายการ</div>`
          : '';

        const mobileIndicators = bookings.length > 0
          ? `<div class="sm:hidden flex items-center justify-center gap-1 mt-1.5 flex-wrap">
              ${approvedCount > 0 ? `<span class="w-2 h-2 rounded-full ${isRoom ? 'bg-indigo-500' : 'bg-sky-500'}"></span>` : ''}
              ${pendingCount > 0 ? `<span class="w-2 h-2 rounded-full bg-amber-400"></span>` : ''}
              ${bookings.length > 1 ? `<span class="text-[9px] font-bold text-slate-500">${bookings.length}</span>` : ''}
            </div>`
          : (!isPast ? `<div class="sm:hidden flex justify-center mt-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400/80"></span></div>` : '');

        cellsHtml += `
          <button type="button" onclick="selectCalendarDate('${ymd}')"
            class="text-left min-h-[60px] sm:min-h-[96px] p-1.5 sm:p-2 border-b border-r border-slate-100 transition flex flex-col justify-start gap-1 relative ${
              isSelected
                ? (isRoom ? 'bg-indigo-50/80 ring-2 ring-inset ring-indigo-500 z-10' : 'bg-sky-50/80 ring-2 ring-inset ring-sky-500 z-10')
                : isPast
                  ? 'bg-slate-50/40 hover:bg-slate-100/60'
                  : 'bg-white hover:bg-slate-50'
            }">
            <div class="flex items-center justify-between w-full">
              <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold ${
                isToday
                  ? (isRoom ? 'bg-indigo-600 text-white' : 'bg-sky-600 text-white')
                  : isWeekend
                    ? 'text-rose-500'
                    : isPast ? 'text-slate-400' : 'text-slate-700'
              }">${dayNum}</span>
              ${bookings.length === 0 && !isPast
                ? `<span class="hidden sm:inline text-[10px] font-medium text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-md">ว่าง</span>`
                : ''
              }
            </div>
            <div class="w-full space-y-1">
              ${desktopPills}
              ${morePill}
              ${mobileIndicators}
            </div>
          </button>
        `;
      }

      const selectedDayBookings = getBookingsForDate(state.dashboardType, selectedYmd, state.calendarResourceFilter);
      const canBookSelectedDay = selectedYmd >= todayYmd;

      return `
        <div class="p-4 sm:p-5 space-y-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center justify-between sm:justify-start gap-2">
              <div class="flex items-center gap-1">
                <button type="button" onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 active:scale-95 transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="min-w-[150px] text-center font-bold text-sm sm:text-base text-slate-900">
                  ${thaiMonths[month]} ${year + 543}
                </div>
                <button type="button" onclick="changeCalendarMonth(1)" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 active:scale-95 transition">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
              <button type="button" onclick="goCalendarToday()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
                วันนี้
              </button>
            </div>

            <div class="flex items-center gap-2">
              <label class="text-xs font-medium text-slate-500 whitespace-nowrap">แสดงเฉพาะ:</label>
              <select onchange="setCalendarResourceFilter(this.value)"
                class="flex-1 sm:flex-none px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-700 outline-none focus:border-indigo-500">
                <option value="ALL">${isRoom ? 'ห้องประชุมทั้งหมด' : 'รถราชการทุกคัน'}</option>
                ${resourceOptions}
              </select>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-[11px] text-slate-600">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> ว่าง (ไม่มีจอง)</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${isRoom ? 'bg-indigo-500' : 'bg-sky-500'}"></span> อนุมัติแล้ว</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> รออนุมัติ</span>
          </div>

          <div class="rounded-2xl border border-slate-200 overflow-hidden">
            <div class="grid grid-cols-7 bg-slate-100/90 border-b border-slate-200">
              ${dayHeaders.map((h, idx) => `
                <div class="py-2 text-center text-[11px] font-bold ${idx === 0 || idx === 6 ? 'text-rose-500' : 'text-slate-600'}">${h}</div>
              `).join('')}
            </div>
            <div class="grid grid-cols-7">
              ${cellsHtml}
            </div>
          </div>

          <div class="rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <p class="text-[11px] font-semibold uppercase tracking-wide ${isRoom ? 'text-indigo-600' : 'text-sky-600'}">
                  รายละเอียดประจำวันที่เลือก
                </p>
                <h4 class="font-bold text-sm sm:text-base text-slate-900">
                  วันที่ ${formatThaiDateFull(selectedYmd)}
                  <span class="text-xs font-normal text-slate-500">(${selectedDayBookings.length} รายการ)</span>
                </h4>
              </div>
              ${canBookSelectedDay ? `
                <button type="button" onclick="quickBookFromDate('${state.dashboardType}', '${selectedYmd}')"
                  class="self-start sm:self-auto px-4 py-2 rounded-xl ${isRoom ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-sky-600 hover:bg-sky-700'} text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
                  <i data-lucide="plus-circle" class="w-4 h-4"></i>
                  จอง${isRoom ? 'ห้องประชุม' : 'รถราชการ'}วันนี้เลย
                </button>
              ` : `<span class="text-xs text-slate-400">วันที่ผ่านมาแล้ว</span>`}
            </div>

            ${selectedDayBookings.length === 0 ? `
              <div class="bg-white rounded-2xl border border-emerald-200/80 p-5 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                  <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                </div>
                <div>
                  <p class="text-sm font-semibold text-emerald-900">ว่างตลอดทั้งวัน</p>
                  <p class="text-xs text-slate-500">ยังไม่มีรายการจอง${isRoom ? 'ห้องประชุม' : 'รถราชการ'}ในวันที่เลือก สามารถกดปุ่มจองด้านบนได้ทันที</p>
                </div>
              </div>
            ` : `
              <div class="space-y-2.5">
                ${selectedDayBookings.map(b => renderScheduleCard(state.dashboardType, b)).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderScheduleCard(type, b) {
      const isRoom = type === 'room';
      return `
        <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="space-y-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold ${isRoom ? 'bg-indigo-50 text-indigo-700' : 'bg-sky-50 text-sky-700'}">
                ${isRoom ? esc(b.Room_Name) : `${esc(b.Vehicle_Name)} (${esc(b.Plate_Number)})`}
              </span>
              ${bookingStatusBadge(b.Status)}
            </div>
            <p class="font-semibold text-sm text-slate-900 truncate">
              ${isRoom ? esc(b.Title) : `${esc(b.Purpose)} ณ ${esc(b.Destination)}`}
            </p>
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500">
              <span class="flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                ${isRoom
                  ? `${formatThaiDateShort(b.Booking_Date)} • ${b.Start_Time} - ${b.End_Time} น.`
                  : `${formatThaiDateShort(b.Start_Date)} ${b.Start_Time} - ${formatThaiDateShort(b.End_Date)} ${b.End_Time}`
                }
              </span>
              <span class="flex items-center gap-1">
                <i data-lucide="user" class="w-3.5 h-3.5"></i>
                ${esc(b.Requester_Name)} (${esc(b.Department)})
              </span>
            </div>
          </div>
        </div>
      `;
    }

    function bookingStatusBadge(status) {
      const map = {
        Pending: '<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">รออนุมัติ</span>',
        Approved: '<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">อนุมัติแล้ว</span>',
        Rejected: '<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200">ไม่อนุมัติ</span>',
        Cancelled: '<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-600 border border-slate-200">ยกเลิกแล้ว</span>'
      };
      return map[status] || status;
    }

    function resourceStatusBadge(status) {
      return status === 'Active'
        ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-50 text-emerald-700 shrink-0">พร้อมใช้</span>'
        : '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-rose-50 text-rose-700 shrink-0">งดใช้/ซ่อม</span>';
    }

    // ========================================================================
    // 8. PAGE 2: BOOK ROOM (จองห้องประชุม + ตรวจเวลาว่างเรียลไทม์)
    // ========================================================================
    function getRoomConflict(roomId, dateStr, startTime, endTime) {
      if (!roomId || !dateStr || !startTime || !endTime) return null;
      const reqStart = toTimestamp(dateStr, startTime);
      const reqEnd = toTimestamp(dateStr, endTime);
      if (reqEnd <= reqStart) return { invalidTime: true };

      return state.roomBookings.find(b => {
        if (b.Room_ID !== roomId) return false;
        if (b.Status === 'Rejected' || b.Status === 'Cancelled') return false;
        if (b.Booking_Date !== dateStr) return false;
        return isTimeOverlap(reqStart, reqEnd, toTimestamp(b.Booking_Date, b.Start_Time), toTimestamp(b.Booking_Date, b.End_Time));
      }) || null;
    }

    function renderBookRoomPage() {
      const f = state.roomForm;
      const activeRooms = state.rooms.filter(r => r.Status === 'Active');
      const conflict = getRoomConflict(f.roomId, f.bookingDate, f.startTime, f.endTime);

      const equipOptions = [
        'เครื่องเสียง / ไมโครโฟน',
        'โปรเจกเตอร์ / จอ LED',
        'ระบบประชุมออนไลน์ (Zoom/Meet)',
        'คอมพิวเตอร์โน้ตบุ๊ก',
        'น้ำดื่ม / อาหารว่าง',
        'ป้ายเวที / ถ่ายภาพ'
      ];

      return `
        <div class="max-w-3xl mx-auto space-y-5 fade-in">
          <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-5 sm:p-7 space-y-6">
            <div class="flex items-center gap-3 pb-4 border-b border-slate-100">
              <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-200">
                <i data-lucide="building-2" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="font-bold text-base sm:text-lg text-slate-900">แบบฟอร์มขอใช้ห้องประชุม</h3>
                <p class="text-xs text-slate-500">ตรวจสอบสถานะว่างอัตโนมัติและส่งแจ้งเตือนผู้อนุมัติทันที</p>
              </div>
            </div>

            <!-- 1. เลือกห้องประชุม -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2">1. เลือกห้องประชุม <span class="text-rose-500">*</span></label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${activeRooms.map(r => {
                  const selected = f.roomId === r.Room_ID;
                  const roomConflict = getRoomConflict(r.Room_ID, f.bookingDate, f.startTime, f.endTime);
                  const isBusy = roomConflict && !roomConflict.invalidTime;
                  return `
                    <button type="button" onclick="updateRoomForm('roomId', '${r.Room_ID}')"
                      class="text-left p-3.5 rounded-2xl border-2 transition ${
                        selected
                          ? 'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-100'
                          : 'border-slate-200 hover:border-slate-300 bg-white'
                      }">
                      <div class="flex items-start justify-between gap-2">
                        <span class="font-bold text-sm text-slate-900">${esc(r.Room_Name)}</span>
                        ${isBusy
                          ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-100 text-rose-700 shrink-0">ไม่ว่าง</span>'
                          : '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-700 shrink-0">ว่าง</span>'
                        }
                      </div>
                      <p class="text-xs text-slate-500 mt-1">${esc(r.Building)} • จุ ${r.Capacity} คน</p>
                      <p class="text-[11px] text-slate-400 mt-1 line-clamp-1">${esc(r.Amenities)}</p>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 2. วันและเวลา -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">2. วันที่ใช้ห้อง <span class="text-rose-500">*</span></label>
                <input type="date" min="${getTodayYMD()}" value="${f.bookingDate}"
                  onchange="updateRoomForm('bookingDate', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">เวลาเริ่มต้น <span class="text-rose-500">*</span></label>
                <input type="time" value="${f.startTime}"
                  onchange="updateRoomForm('startTime', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">เวลาสิ้นสุด <span class="text-rose-500">*</span></label>
                <input type="time" value="${f.endTime}"
                  onchange="updateRoomForm('endTime', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm" />
              </div>
            </div>

            <!-- แจ้งเตือนสถานะเวลา -->
            ${conflict ? (conflict.invalidTime ? `
              <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-center gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                <span>เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น กรุณาตรวจสอบเวลาอีกครั้ง</span>
              </div>
            ` : `
              <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-start gap-2">

                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm bg-white">
                    ${['ปกติ', 'รูปตัวยู (U-Shape)', 'ห้องเรียน (Classroom)', 'เธียเตอร์ (Theater)', 'โต๊ะประชุมกลุ่ม'].map(s =>
                      `<option value="${s}" ${f.seatingStyle === s ? 'selected' : ''}>${s}</option>`
                    ).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-2">อุปกรณ์ / สิ่งอำนวยความสะดวกที่ต้องการ (แจ้งฝ่ายโสตฯ)</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${equipOptions.map(eq => {
                    const checked = f.equipment.includes(eq);
                    return `
                      <label class="flex items-center gap-2.5 p-2.5 rounded-xl border ${checked ? 'border-indigo-300 bg-indigo-50/40' : 'border-slate-200'} cursor-pointer text-xs">
                        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleRoomEquipment('${eq}')"

                  placeholder="ระบุรายละเอียดเพิ่มเติมสำหรับเจ้าหน้าที่อาคารสถานที่หรือฝ่ายโสตฯ"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm">${esc(f.note)}</textarea>

            <button type="button" onclick="submitRoomBooking()" ${conflict || state.isSubmitting ? 'disabled' : ''}
              class="w-full py-3.5 rounded-2xl ${conflict ? 'bg-slate-300 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] shadow-md shadow-indigo-200'} text-white font-bold text-sm transition flex items-center justify-center gap-2">
              <i data-lucide="${state.isSubmitting ? 'loader-2' : 'send'}" class="w-4 h-4 ${state.isSubmitting ? 'animate-spin' : ''}"></i>
              ${state.isSubmitting ? 'กำลังส่งคำขอจอง...' : 'ยืนยันส่งคำขอจองห้องประชุม'}
            </button>
          </div>
        </div>
      `;
    }

    function updateRoomForm(key, val) {
      state.roomForm[key] = val;
      renderCurrentPage();
    }

    function toggleRoomEquipment(eq) {
      const idx = state.roomForm.equipment.indexOf(eq);
      if (idx >= 0) state.roomForm.equipment.splice(idx, 1);
      else state.roomForm.equipment.push(eq);
      renderCurrentPage();
    }

    async function submitRoomBooking() {
      const f = state.roomForm;
      if (!f.roomId || !f.bookingDate || !f.title.trim()) {
        showToast('กรุณาเลือกห้องประชุม วันที่ และกรอกหัวข้อการประชุมให้ครบถ้วน', 'warning');
        return;
      }
      if (getRoomConflict(f.roomId, f.bookingDate, f.startTime, f.endTime)) {
        showToast('ห้องประชุมไม่ว่างในช่วงเวลาที่เลือก', 'error');
        return;
      }

      state.isSubmitting = true;
      renderCurrentPage();
      try {
        const res = await apiPost({
          action: 'createRoomBooking',
          userId: state.user.userId,
          roomId: f.roomId,
          bookingDate: f.bookingDate,
          startTime: f.startTime,
          endTime: f.endTime,
          title: f.title.trim(),
          attendees: Number(f.attendees || 0),
          seatingStyle: f.seatingStyle,
          equipment: f.equipment,
          note: f.note.trim()
        });

        if (res.status === 'success') {
          showToast(`ส่งคำขอจองเรียบร้อย (${res.bookingId})`, 'success');
          state.roomForm.title = '';
          state.roomForm.note = '';
          await loadWorkspaceData(false);
          switchTab('my-bookings');
        } else {
          showToast(res.message || 'ไม่สามารถบันทึกการจองได้', 'error');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      } finally {
        state.isSubmitting = false;
        renderCurrentPage();
      }
    }

    // ========================================================================
    // 9. PAGE 3: BOOK VEHICLE (จองรถราชการ + ตรวจคิวรถและคนขับ)
    // ========================================================================
    function getVehicleConflict(vehicleId, startDate, startTime, endDate, endTime) {
      if (!vehicleId || !startDate || !endDate) return null;
      const reqStart = toTimestamp(startDate, startTime);
      const reqEnd = toTimestamp(endDate, endTime);
      if (reqEnd <= reqStart) return { invalidTime: true };

      return state.vehicleBookings.find(b => {
        if (b.Vehicle_ID !== vehicleId) return false;
        if (b.Status === 'Rejected' || b.Status === 'Cancelled') return false;
        return isTimeOverlap(reqStart, reqEnd, toTimestamp(b.Start_Date, b.Start_Time), toTimestamp(b.End_Date, b.End_Time));
      }) || null;
    }

    function getDriverConflict(driverId, startDate, startTime, endDate, endTime) {
      if (!driverId || driverId === 'AUTO') return null;
      const reqStart = toTimestamp(startDate, startTime);
      const reqEnd = toTimestamp(endDate, endTime);
      if (reqEnd <= reqStart) return null;

      return state.vehicleBookings.find(b => {
        if (b.Driver_ID !== driverId) return false;
        if (b.Status === 'Rejected' || b.Status === 'Cancelled') return false;
        return isTimeOverlap(reqStart, reqEnd, toTimestamp(b.Start_Date, b.Start_Time), toTimestamp(b.End_Date, b.End_Time));
      }) || null;
    }

    function renderBookVehiclePage() {

      const activeVehicles = state.vehicles.filter(v => v.Status === 'Active');

      const driverConflict = getDriverConflict(f.driverId, f.startDate, f.startTime, f.endDate, f.endTime);

      const selectedVeh = activeVehicles.find(v => v.Vehicle_ID === f.vehicleId);
      const totalPassengers = Number(f.teacherCount || 0) + Number(f.studentCount || 0);
      const overCapacity = selectedVeh && totalPassengers > Number(selectedVeh.Seats || 99);

      return `

              <div class="w-11 h-11 rounded-2xl bg-sky-600 text-white flex items-center justify-center shadow-md shadow-sky-200">

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${activeVehicles.map(v => {
                  const selected = f.vehicleId === v.Vehicle_ID;
                  const vConflict = getVehicleConflict(v.Vehicle_ID, f.startDate, f.startTime, f.endDate, f.endTime);
                  const isBusy = vConflict && !vConflict.invalidTime;
                  return `
                    <button type="button" onclick="updateVehicleForm('vehicleId', '${v.Vehicle_ID}')"
                      class="text-left p-3.5 rounded-2xl border-2 transition ${

                          : 'border-slate-200 hover:border-slate-300 bg-white'

                      <div class="flex items-start justify-between gap-2">
                        <span class="font-bold text-sm text-slate-900">${esc(v.Vehicle_Name)}</span>
                        ${isBusy

                        }
                      </div>
                      <p class="text-xs font-semibold text-sky-700 mt-1">${esc(v.Plate_Number)}</p>
                      <p class="text-[11px] text-slate-500 mt-0.5">${esc(v.Vehicle_Type)} • รองรับ ${v.Seats} ที่นั่ง</p>
                    </button>
                  `;
                }).join('')}

            </div>

            <!-- 2. วันและเวลาไป-กลับ -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">วันที่ออกเดินทาง <span class="text-rose-500">*</span></label>
                <input type="date" min="${getTodayYMD()}" value="${f.startDate}"
                  onchange="updateVehicleStartDate(this.value)"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">เวลาไป <span class="text-rose-500">*</span></label>
                <input type="time" value="${f.startTime}"
                  onchange="updateVehicleForm('startTime', this.value)"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">วันที่เดินทางกลับ <span class="text-rose-500">*</span></label>
                <input type="date" min="${f.startDate}" value="${f.endDate}"
                  onchange="updateVehicleForm('endDate', this.value)"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">เวลากลับ <span class="text-rose-500">*</span></label>
                <input type="time" value="${f.endTime}"
                  onchange="updateVehicleForm('endTime', this.value)"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
              </div>
            </div>

            <!-- แจ้งเตือนสถานะรถ -->
            ${conflict ? (conflict.invalidTime ? `
              <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-center gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                <span>วัน-เวลากลับต้องมากกว่าวัน-เวลาออกเดินทาง</span>
              </div>
            ` : `
              <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <div>
                  <p class="font-bold">รถคันนี้ไม่ว่างในช่วงเวลาที่เลือก!</p>
                  <p class="mt-0.5">ติดภารกิจของ <b>${esc(conflict.Requester_Name)}</b> (${formatThaiDateShort(conflict.Start_Date)} ${conflict.Start_Time} - ${formatThaiDateShort(conflict.End_Date)} ${conflict.End_Time})</p>
                </div>
              </div>
            `) : `
              <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0 text-emerald-600"></i>
                <span>รถราชการว่างพร้อมให้บริการในช่วงเวลาที่เลือก</span>
              </div>
            `}

            <!-- 3. รายละเอียดภารกิจและสถานที่ -->
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">3. ไปราชการเรื่อง / ภารกิจ <span class="text-rose-500">*</span></label>
                <input type="text" value="${esc(f.purpose)}" oninput="state.vehicleForm.purpose = this.value"
                  placeholder="เช่น นำนักเรียนเข้าร่วมการแข่งขันทักษะวิชาการศิลปหัตถกรรม"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-700 mb-1">สถานที่ปลายทาง <span class="text-rose-500">*</span></label>
                  <input type="text" value="${esc(f.destination)}" oninput="state.vehicleForm.destination = this.value"
                    placeholder="เช่น มหาวิทยาลัยสงขลานครินทร์ วิทยาเขตหาดใหญ่"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">จังหวัด</label>
                  <input type="text" value="${esc(f.province)}" oninput="state.vehicleForm.province = this.value"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />
                </div>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">

                  <label class="block text-xs font-bold text-slate-700 mb-1">จำนวนครู/บุคลากร (คน)</label>

                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">จำนวนนักเรียน (คน)</label>

                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm" />

                <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-center gap-2">
                  <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
                  <span>จำนวนผู้โดยสารรวม (${totalPassengers} คน) เกินจำนวนที่นั่งของรถ (${selectedVeh.Seats} ที่นั่ง)</span>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">พนักงานขับรถ</label>

                  <option value="AUTO" ${f.driverId === 'AUTO' ? 'selected' : ''}>ให้หัวหน้างานยานพาหนะจัดให้ (แนะนำ)</option>
                  ${activeDrivers.map(d => {
                    const busy = getDriverConflict(d.Driver_ID, f.startDate, f.startTime, f.endDate, f.endTime);
                    return `<option value="${d.Driver_ID}" ${f.driverId === d.Driver_ID ? 'selected' : ''}>${esc(d.Driver_Name)} (${esc(d.Phone)}) ${busy ? '— [ติดคิวงาน]' : ''}</option>`;
                  }).join('')}
                </select>
                ${driverConflict ? `<p class="text-xs text-rose-600 mt-1">พนักงานขับรถท่านนี้ติดภารกิจในช่วงเวลาดังกล่าว</p>` : ''}
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุเพิ่มเติม (จุดรับ-ส่ง / สัมภาระ)</label>
                <textarea rows="2" oninput="state.vehicleForm.note = this.value"
                  placeholder="เช่น จุดขึ้นรถหน้าอาคารอำนวยการ เวลา 07.45 น."
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-sky-500 outline-none text-sm">${esc(f.note)}</textarea>
              </div>
            </div>

            <button type="button" onclick="submitVehicleBooking()" ${conflict || driverConflict || state.isSubmitting ? 'disabled' : ''}
              class="w-full py-3.5 rounded-2xl ${conflict || driverConflict ? 'bg-slate-300 cursor-not-allowed' : 'bg-sky-600 hover:bg-sky-700 active:scale-[0.99] shadow-md shadow-sky-200'} text-white font-bold text-sm transition flex items-center justify-center gap-2">
              <i data-lucide="${state.isSubmitting ? 'loader-2' : 'send'}" class="w-4 h-4 ${state.isSubmitting ? 'animate-spin' : ''}"></i>
              ${state.isSubmitting ? 'กำลังส่งคำขอจองรถ...' : 'ยืนยันส่งคำขอจองรถราชการ'}
            </button>
          </div>
        </div>
      `;
    }

    function updateVehicleForm(key, val) {
      state.vehicleForm[key] = val;
      renderCurrentPage();
    }

    function updateVehicleStartDate(val) {
      state.vehicleForm.startDate = val;
      if (state.vehicleForm.endDate < val) state.vehicleForm.endDate = val;
      renderCurrentPage();
    }

    async function submitVehicleBooking() {
      const f = state.vehicleForm;
      if (!f.vehicleId || !f.startDate || !f.purpose.trim() || !f.destination.trim()) {
        showToast('กรุณากรอกข้อมูลภารกิจ สถานที่ปลายทาง และเลือกรถให้ครบถ้วน', 'warning');
        return;
      }
      if (getVehicleConflict(f.vehicleId, f.startDate, f.startTime, f.endDate, f.endTime)) {
        showToast('รถราชการไม่ว่างในช่วงเวลาที่เลือก', 'error');
        return;
      }

      state.isSubmitting = true;
      renderCurrentPage();
      try {
        const res = await apiPost({
          action: 'createVehicleBooking',
          userId: state.user.userId,
          vehicleId: f.vehicleId,
          startDate: f.startDate,
          startTime: f.startTime,
          endDate: f.endDate,
          endTime: f.endTime,
          purpose: f.purpose.trim(),
          destination: f.destination.trim(),
          province: f.province.trim(),
          docRef: f.docRef.trim(),
          teacherCount: Number(f.teacherCount || 0),
          studentCount: Number(f.studentCount || 0),
          driverId: f.driverId,
          note: f.note.trim()
        });

        if (res.status === 'success') {
          showToast(`ส่งคำขอจองรถเรียบร้อย (${res.bookingId})`, 'success');
          state.vehicleForm.purpose = '';
          state.vehicleForm.destination = '';
          state.vehicleForm.note = '';
          await loadWorkspaceData(false);
          switchTab('my-bookings');
        } else {
          showToast(res.message || 'ไม่สามารถบันทึกการจองได้', 'error');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      } finally {
        state.isSubmitting = false;
        renderCurrentPage();
      }
    }

          action: 'cancelBooking',
          userId: state.user.userId,
          bookingType,
          bookingId

          await loadWorkspaceData(false);

                        </select>

                    ` : ''}

                      <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">

                        </button>
                        <button onclick="processApproval('${b._type}', '${b.Booking_ID}', 'Approved')"

    function openRejectModal(bookingType, bookingId) {
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-900">ระบุเหตุผลที่ไม่อนุมัติ</h3>
          <textarea id="rejectReasonInput" rows="3" placeholder="เช่น มีภารกิจเร่งด่วนของโรงเรียนในช่วงเวลาดังกล่าว"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-rose-500 outline-none text-sm"></textarea>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">ยกเลิก</button>
            <button onclick="submitReject('${bookingType}', '${bookingId}')" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold">ยืนยันไม่อนุมัติ</button>
          </div>
        </div>
      `);
    }

    function submitReject(bookingType, bookingId) {
      const reason = document.getElementById('rejectReasonInput').value.trim();
      closeModal();
      processApproval(bookingType, bookingId, 'Rejected', reason);
    }

    async function processApproval(bookingType, bookingId, newStatus, rejectReason = '') {
      let driverId = '';
      if (bookingType === 'vehicle' && newStatus === 'Approved') {
        const sel = document.getElementById(`driverAssign_${bookingId}`);
        if (sel) driverId = sel.value;
      }

      showToast('กำลังบันทึกผลการพิจารณาและแจ้งเตือน LINE...', 'info');
      try {
        const res = await apiPost({
          action: 'updateBookingStatus',
          userId: state.user.userId,
          bookingType,
          bookingId,
          newStatus,
          rejectReason,
          driverId
        });

        if (res.status === 'success') {
          showToast(res.message, 'success');
          await loadWorkspaceData(false);
        } else {
          showToast(res.message || 'ดำเนินการไม่สำเร็จ', 'error');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      }
    }
