  <script>
    // ========================================================================
    // 1. ตั้งค่าการเชื่อมต่อระบบจริง (โรงเรียนจะนะชนูปถัมภ์)
    // ========================================================================
    const APP_CONFIG = {
      SCHOOL_NAME: 'โรงเรียนจะนะชนูปถัมภ์',
      LIFF_ID: '2012824375-7JdM4XJD',
      GAS_WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbzeCtbrGugMQb83JqL3Im6fApPEH6gewqAFR4l6rPX4NUIulGT1XtbMf6MWzvylfrFH/exec'
    };

    // ========================================================================
    // 2. APPLICATION STATE
    // ========================================================================
    const state = {
      activeTab: 'dashboard',
      dashboardType: 'room', // 'room' | 'vehicle'
      dashboardViewMode: 'calendar', // 'calendar' | 'list'
      dashboardDateFilter: 'all', // 'today' | 'tomorrow' | 'all' | 'custom'
      dashboardCustomDate: getTodayYMD(),
      calendarYear: new Date().getFullYear(),
      calendarMonth: new Date().getMonth(),
      calendarSelectedDate: getTodayYMD(),
      calendarResourceFilter: 'ALL',
      myBookingTab: 'upcoming', // 'upcoming' | 'history'
      myBookingTypeFilter: 'ALL',
      approvalTab: 'pending', // 'pending' | 'history'
      adminTab: 'rooms', // 'rooms' | 'vehicles' | 'drivers' | 'users'
      lineProfile: {
        userId: '',
        displayName: '',
        pictureUrl: ''
      },
      user: null,
      realRole: null,
      previewRole: null,
      rooms: [],
      vehicles: [],
      drivers: [],
      roomBookings: [],
      vehicleBookings: [],
      users: [],
      roomForm: {
        roomId: '',
        bookingDate: getTodayYMD(),
        startTime: '08:30',
        endTime: '12:00',
        title: '',
        attendees: 30,
        seatingStyle: 'ใช้ตามสภาพเดิมของห้อง (ปกติ)',
        seatingDetail: '',
        equipment: ['เครื่องเสียง / ไมโครโฟน'],
        note: ''
      },
      vehicleForm: {
        vehicleId: '',
        startDate: getTodayYMD(),
        startTime: '08:00',
        endDate: getTodayYMD(),
        endTime: '16:30',
        purpose: '',
        destination: '',
        province: 'สงขลา',
        docRef: '',
        teacherCount: 2,
        studentCount: 10,
        driverId: 'AUTO',
        note: ''
      },
      isSubmitting: false,
      isProcessingAction: false
    };

    // ========================================================================
    // 3. DATE & UTILITY HELPERS
    // ========================================================================
    function getTodayYMD() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTomorrowYMD() {
      const tmr = new Date();
      tmr.setDate(tmr.getDate() + 1);
      const y = tmr.getFullYear();
      const m = String(tmr.getMonth() + 1).padStart(2, '0');
      const d = String(tmr.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatThaiDateShort(ymd) {
      if (!ymd) return '-';
      const p = String(ymd).split('-');
      if (p.length !== 3) return ymd;
      const months = ['', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      return `${Number(p[2])} ${months[Number(p[1])]} ${Number(p[0]) + 543}`;
    }

    function formatThaiDateFull(ymd) {
      if (!ymd) return '-';
      const p = String(ymd).split('-');
      if (p.length !== 3) return ymd;
      const months = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      return `${Number(p[2])} ${months[Number(p[1])]} พ.ศ. ${Number(p[0]) + 543}`;
    }

    function toTimestamp(dateStr, timeStr) {
      const p = String(dateStr).split('-');
      const t = String(timeStr).split(':');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), Number(t[0]), Number(t[1] || 0), 0).getTime();
    }

    function isTimeOverlap(startA, endA, startB, endB) {
      return startA < endB && endA > startB;
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseEquipmentList(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val;
      try {
        const parsed = JSON.parse(val);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return String(val).trim() ? [String(val).trim()] : [];
      }
    }

    function encodePrintPayload(obj) {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodePrintPayload(str) {
      let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function getCacheKey(userId) {
      return 'chana_booking_v2_' + userId;
    }

    function saveLocalCache(userId, data) {
      if (!userId || !data) return;
      try {
        localStorage.setItem(getCacheKey(userId), JSON.stringify({
          savedAt: Date.now(),
          data
        }));
      } catch (e) {}
    }

    function loadLocalCache(userId) {
      if (!userId) return null;
      try {
        const raw = localStorage.getItem(getCacheKey(userId));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.data || !parsed.data.user) return null;
        return parsed.data;
      } catch (e) {
        return null;
      }
    }

    function showRegisterScreen() {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('mainShell').classList.add('hidden');
      document.getElementById('mobileBottomNav').classList.add('hidden');
      document.getElementById('registerScreen').classList.remove('hidden');

      if (state.lineProfile.displayName) {
        document.getElementById('regLineNameText').textContent = `LINE: ${state.lineProfile.displayName}`;
      }
      lucide.createIcons();
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      const fullName = document.getElementById('regFullName').value.trim();
      const position = document.getElementById('regPosition').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const department = document.getElementById('regDepartment').value;

      if (!fullName || !department) {
        showToast('กรุณากรอกชื่อ-นามสกุล และเลือกกลุ่มสาระฯ/ฝ่ายงาน', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึกข้อมูล...`;
      lucide.createIcons();

      try {
        const res = await apiPost({
          action: 'registerUser',
          userId: state.lineProfile.userId,
          fullName,
          position,
          phone,
          department
        });

        if (res.status === 'success') {
          showToast('ลงทะเบียนเรียบร้อย ยินดีต้อนรับครับ!', 'success');
          document.getElementById('registerScreen').classList.add('hidden');
          document.getElementById('loadingScreen').classList.remove('hidden');
          document.getElementById('loadingSubtext').textContent = 'กำลังโหลดข้อมูลตารางการจอง...';
          await loadWorkspaceData();
        } else {
          showToast(res.message || 'เกิดข้อผิดพลาดในการลงทะเบียน', 'error');
        }
      } catch (err) {
        showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i> ยืนยันการลงทะเบียนและเข้าใช้งาน`;
        lucide.createIcons();
      }
    });

    async function loadWorkspaceData(showNotification = false) {
      const data = await apiGet({
        action: 'getBootstrapData',
        userId: state.lineProfile.userId
      });

      if (data.status === 'unregistered') {
        showRegisterScreen();
        return;
      }

      if (data.status !== 'success') {
        throw new Error(data.message || 'โหลดข้อมูลไม่สำเร็จ');
      }

      state.user = data.user;
      state.realRole = data.user.role;
      if (state.realRole === 'Admin' && state.previewRole) {
        state.user.role = state.previewRole;
      }
      state.rooms = data.rooms || [];
      state.vehicles = data.vehicles || [];
      state.drivers = data.drivers || [];
      state.roomBookings = data.roomBookings || [];
      state.vehicleBookings = data.vehicleBookings || [];
      state.users = data.users || [];

      if (!state.roomForm.roomId) {
        const activeRoom = state.rooms.find(r => r.Status === 'Active');
        if (activeRoom) state.roomForm.roomId = activeRoom.Room_ID;
      }
      if (!state.vehicleForm.vehicleId) {
        const activeVeh = state.vehicles.find(v => v.Status === 'Active');
        if (activeVeh) state.vehicleForm.vehicleId = activeVeh.Vehicle_ID;
      }

      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('registerScreen').classList.add('hidden');
      document.getElementById('mainShell').classList.remove('hidden');
      document.getElementById('mobileBottomNav').classList.remove('hidden');

      updateUserProfileUI();
      renderNavigation();
      renderCurrentPage();

      if (showNotification) {
        showToast('อัปเดตข้อมูลล่าสุดเรียบร้อยแล้ว', 'success');
      }
    }

    async function refreshData(notify = false) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin');
      try {
        await loadWorkspaceData(notify);
      } catch (e) {
        showToast('รีเฟรชข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error');
      } finally {
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    function updateUserProfileUI() {
      const u = state.user;
      if (!u) return;
      const roleLabels = {
        Admin: 'ผู้ดูแลระบบ',
        Approver: 'ผู้อนุมัติ',
        Teacher: 'ครู/บุคลากร',
        AV_Staff: 'จนท.โสตฯ',
        Driver: 'พนักงานขับรถ'
      };
      document.getElementById('sidebarUserName').textContent = u.fullName;
      document.getElementById('sidebarUserRole').textContent = roleLabels[u.role] || u.role;
      document.getElementById('sidebarUserDept').textContent = u.department;
      document.getElementById('mobileUserSub').textContent = `${u.fullName} • ${roleLabels[u.role] || u.role}`;

      const avatarEl = document.getElementById('sidebarAvatar');
      if (state.lineProfile.pictureUrl) {
        avatarEl.innerHTML = `<img src="${esc(state.lineProfile.pictureUrl)}" alt="avatar" class="w-full h-full object-cover" />`;
      } else {
        avatarEl.textContent = u.fullName.charAt(0);
      }

      // แสดงตัวเลือกจำลองมุมมองสิทธิ์เฉพาะ Admin ตัวจริงเท่านั้น
      const previewContainer = document.getElementById('adminPreviewContainer');
      const previewBanner = document.getElementById('previewBanner');
      if (state.realRole === 'Admin') {
        previewContainer.classList.remove('hidden');
        previewContainer.innerHTML = `
          <select onchange="setPreviewRole(this.value)" title="จำลองมุมมองสิทธิ์ (เห็นเฉพาะผู้ดูแลระบบ)"
            class="px-2.5 py-1.5 rounded-xl border ${state.previewRole ? 'border-amber-400 bg-amber-50 text-amber-800' : 'border-slate-200 bg-white text-slate-700'} text-xs font-semibold outline-none cursor-pointer">
            <option value="Admin" ${!state.previewRole ? 'selected' : ''}>👁️ Admin</option>
            <option value="Teacher" ${state.previewRole === 'Teacher' ? 'selected' : ''}>👁️ มุมมองครู</option>
            <option value="Approver" ${state.previewRole === 'Approver' ? 'selected' : ''}>👁️ ผู้อนุมัติ</option>
            <option value="AV_Staff" ${state.previewRole === 'AV_Staff' ? 'selected' : ''}>👁️ จนท.โสตฯ</option>
            <option value="Driver" ${state.previewRole === 'Driver' ? 'selected' : ''}>👁️ คนขับรถ</option>
          </select>
        `;

        if (state.previewRole) {
          previewBanner.classList.remove('hidden');
          document.getElementById('previewBannerText').textContent =
            `โหมดทดสอบ: กำลังดูหน้าจอในมุมมอง "${roleLabels[state.previewRole] || state.previewRole}"`;
        } else {
          previewBanner.classList.add('hidden');
        }
      } else {
        previewContainer.classList.add('hidden');
        previewBanner.classList.add('hidden');
      }
    }

    function setPreviewRole(role) {
      if (state.realRole !== 'Admin') return;
      state.previewRole = (role === 'Admin' || !role) ? null : role;
      state.user.role = state.previewRole || state.realRole;

      // หากหน้าปัจจุบันไม่มีสิทธิ์เข้าถึงในมุมมองที่เลือก ให้กลับไปหน้าปฏิทิน
      const allowedIds = getMenuItems().map(i => i.id);
      if (!allowedIds.includes(state.activeTab)) {
        state.activeTab = 'dashboard';
      }

      updateUserProfileUI();
      renderNavigation();
      renderCurrentPage();

      const roleNames = {
        Admin: 'ผู้ดูแลระบบ (ปกติ)',
        Teacher: 'ครู/บุคลากร (จำลอง)',
        Approver: 'ผู้อนุมัติ (จำลอง)',
        AV_Staff: 'จนท.โสตฯ (จำลอง)',
        Driver: 'พนักงานขับรถ (จำลอง)'
      };
      showToast(`สลับเป็นมุมมอง: ${roleNames[state.user.role] || state.user.role}`, 'info');
    }

    // ========================================================================
    // 5. INITIALIZATION & LINE LIFF AUTH
    // ========================================================================
    async function initApp() {
      // โหมดเปิดหน้าพิมพ์บันทึกข้อความ A4 บนเบราว์เซอร์ภายนอก (Safari/Chrome) โดยไม่ต้องล็อกอินซ้ำ
      if (window.location.hash && window.location.hash.startsWith('#print=')) {
        renderStandalonePrintPage();
        return;
      }

      try {
        document.getElementById('loadingSubtext').textContent = 'กำลังเชื่อมต่อ LINE LIFF...';
        await liff.init({ liffId: APP_CONFIG.LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const profile = await liff.getProfile();
        state.lineProfile = {
          userId: profile.userId,
          displayName: profile.displayName || '',
          pictureUrl: profile.pictureUrl || ''
        };

        // แสดงหน้าจอทันทีจากแคชเครื่อง (ถ้าเคยเข้าใช้งานแล้ว) แล้วซิงก์ข้อมูลล่าสุดเบื้องหลัง
        const cachedData = loadLocalCache(state.lineProfile.userId);
        if (cachedData) {
          applyWorkspaceData(cachedData);
          refreshData(false, true);
          return;
        }

        // โหลดและตรวจสอบข้อมูลบุคลากรในคำขอเดียว (ลดรอบการเชื่อมต่อจาก 2 รอบเหลือ 1 รอบ)
        document.getElementById('loadingSubtext').textContent = 'กำลังตรวจสอบข้อมูลบุคลากรและโหลดตาราง...';
        await loadWorkspaceData(false);
      } catch (err) {
        console.error('LIFF/Init Error:', err);
        document.getElementById('loadingScreen').innerHTML = `
          <div class="max-w-sm bg-white p-6 rounded-3xl shadow-lg border border-slate-100 text-center">
            <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="wifi-off" class="w-6 h-6"></i>
            </div>
            <h3 class="font-bold text-slate-900">ไม่สามารถเชื่อมต่อระบบได้</h3>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
              กรุณาเปิดลิงก์ผ่านแอปพลิเคชัน <b>LINE</b> ของโรงเรียนจะนะชนูปถัมภ์ หรือตรวจสอบการเชื่อมต่ออินเทอร์เน็ต
            </p>
            <p class="text-[11px] text-slate-400 mt-2 break-all">${esc(err.message || err)}</p>
            <button onclick="location.reload()" class="mt-4 w-full py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold">
              ลองใหม่อีกครั้ง
            </button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function getBookingsForDate(type, ymd, resourceFilter = 'ALL') {
      if (type === 'room') {
        return state.roomBookings.filter(b => {
          if (b.Status === 'Cancelled' || b.Status === 'Rejected') return false;
          if (resourceFilter !== 'ALL' && b.Room_ID !== resourceFilter) return false;
          return b.Booking_Date === ymd;
        }).sort((a, b) => String(a.Start_Time).localeCompare(String(b.Start_Time)));
      }
      return state.vehicleBookings.filter(b => {
        if (b.Status === 'Cancelled' || b.Status === 'Rejected') return false;
        if (resourceFilter !== 'ALL' && b.Vehicle_ID !== resourceFilter) return false;
        return b.Start_Date <= ymd && b.End_Date >= ymd;
      }).sort((a, b) => String(a.Start_Time).localeCompare(String(b.Start_Time)));
    }

    function renderDashboardCalendar() {
      const isRoom = state.dashboardType === 'room';
      const year = state.calendarYear;
      const month = state.calendarMonth;
      const todayYmd = getTodayYMD();
      const selectedYmd = state.calendarSelectedDate;

      const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      const dayHeaders = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

      const resourceOptions = isRoom
        ? state.rooms.map(r => `<option value="${r.Room_ID}" ${state.calendarResourceFilter === r.Room_ID ? 'selected' : ''}>${esc(r.Room_Name)}</option>`).join('')
        : state.vehicles.map(v => `<option value="${v.Vehicle_ID}" ${state.calendarResourceFilter === v.Vehicle_ID ? 'selected' : ''}>${esc(v.Vehicle_Name)} (${esc(v.Plate_Number)})</option>`).join('');

      let cellsHtml = '';
      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - firstWeekday + 1;
        if (dayNum < 1 || dayNum > daysInMonth) {
          cellsHtml += `<div class="min-h-[60px] sm:min-h-[96px] bg-slate-50/60 border-b border-r border-slate-100"></div>`;
          continue;
        }

        const ymd = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        const bookings = getBookingsForDate(state.dashboardType, ymd, state.calendarResourceFilter);
        const isToday = ymd === todayYmd;
        const isSelected = ymd === selectedYmd;
        const isPast = ymd < todayYmd;
        const isWeekend = (i % 7 === 0 || i % 7 === 6);

        const approvedCount = bookings.filter(b => b.Status === 'Approved').length;
        const pendingCount = bookings.filter(b => b.Status === 'Pending').length;

        const desktopPills = bookings.slice(0, 2).map(b => {
          const pillStyle = b.Status === 'Pending'
            ? 'bg-amber-100 text-amber-800 border-amber-200'
            : (isRoom ? 'bg-indigo-100 text-indigo-800 border-indigo-200' : 'bg-sky-100 text-sky-800 border-sky-200');
          const label = isRoom ? `${b.Start_Time} ${b.Room_Name}` : `${b.Start_Time} ${b.Vehicle_Name}`;
          return `<div class="hidden sm:block truncate text-[10px] font-medium px-1.5 py-0.5 rounded border ${pillStyle}">${esc(label)}</div>`;
        }).join('');

        const morePill = bookings.length > 2
          ? `<div class="hidden sm:block text-[10px] font-semibold text-slate-500 px-1">+${bookings.length - 2} รายการ</div>`
          : '';

        const mobileIndicators = bookings.length > 0
          ? `<div class="sm:hidden flex items-center justify-center gap-1 mt-1.5 flex-wrap">
              ${approvedCount > 0 ? `<span class="w-2 h-2 rounded-full ${isRoom ? 'bg-indigo-500' : 'bg-sky-500'}"></span>` : ''}
              ${pendingCount > 0 ? `<span class="w-2 h-2 rounded-full bg-amber-400"></span>` : ''}
              ${bookings.length > 1 ? `<span class="text-[9px] font-bold text-slate-500">${bookings.length}</span>` : ''}
            </div>`
          : (!isPast ? `<div class="sm:hidden flex justify-center mt-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400/80"></span></div>` : '');

        cellsHtml += `
          <button type="button" onclick="selectCalendarDate('${ymd}')"
            class="text-left min-h-[60px] sm:min-h-[96px] p-1.5 sm:p-2 border-b border-r border-slate-100 transition flex flex-col justify-start gap-1 relative ${
              isSelected
                ? (isRoom ? 'bg-indigo-50/80 ring-2 ring-inset ring-indigo-500 z-10' : 'bg-sky-50/80 ring-2 ring-inset ring-sky-500 z-10')
                : isPast
                  ? 'bg-slate-50/40 hover:bg-slate-100/60'
                  : 'bg-white hover:bg-slate-50'
            }">
            <div class="flex items-center justify-between w-full">
              <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold ${
                isToday
                  ? (isRoom ? 'bg-indigo-600 text-white' : 'bg-sky-600 text-white')
                  : isWeekend
                    ? 'text-rose-500'
                    : isPast ? 'text-slate-400' : 'text-slate-700'
              }">${dayNum}</span>
              ${bookings.length === 0 && !isPast
                ? `<span class="hidden sm:inline text-[10px] font-medium text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-md">ว่าง</span>`
                : ''
              }
            </div>
            <div class="w-full space-y-1">
              ${desktopPills}
              ${morePill}
              ${mobileIndicators}
            </div>
          </button>
        `;
      }

      const selectedDayBookings = getBookingsForDate(state.dashboardType, selectedYmd, state.calendarResourceFilter);
      const canBookSelectedDay = selectedYmd >= todayYmd;

      return `
        <div class="p-4 sm:p-5 space-y-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center justify-between sm:justify-start gap-2">
              <div class="flex items-center gap-1">
                <button type="button" onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 active:scale-95 transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="min-w-[150px] text-center font-bold text-sm sm:text-base text-slate-900">
                  ${thaiMonths[month]} ${year + 543}
                </div>
                <button type="button" onclick="changeCalendarMonth(1)" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 active:scale-95 transition">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
              <button type="button" onclick="goCalendarToday()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
                วันนี้
              </button>
            </div>

            <div class="flex items-center gap-2">
              <label class="text-xs font-medium text-slate-500 whitespace-nowrap">แสดงเฉพาะ:</label>
              <select onchange="setCalendarResourceFilter(this.value)"
                class="flex-1 sm:flex-none px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold text-slate-700 outline-none focus:border-indigo-500">
                <option value="ALL">${isRoom ? 'ห้องประชุมทั้งหมด' : 'รถราชการทุกคัน'}</option>
                ${resourceOptions}
              </select>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-[11px] text-slate-600">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> ว่าง (ไม่มีจอง)</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${isRoom ? 'bg-indigo-500' : 'bg-sky-500'}"></span> อนุมัติแล้ว</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> รออนุมัติ</span>
          </div>

          <div class="rounded-2xl border border-slate-200 overflow-hidden">
            <div class="grid grid-cols-7 bg-slate-100/90 border-b border-slate-200">
              ${dayHeaders.map((h, idx) => `
                <div class="py-2 text-center text-[11px] font-bold ${idx === 0 || idx === 6 ? 'text-rose-500' : 'text-slate-600'}">${h}</div>
              `).join('')}
            </div>
            <div class="grid grid-cols-7">
              ${cellsHtml}
            </div>
          </div>

          <div class="rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <p class="text-[11px] font-semibold uppercase tracking-wide ${isRoom ? 'text-indigo-600' : 'text-sky-600'}">
                  รายละเอียดประจำวันที่เลือก
                </p>
                <h4 class="font-bold text-sm sm:text-base text-slate-900">
                  วันที่ ${formatThaiDateFull(selectedYmd)}
                  <span class="text-xs font-normal text-slate-500">(${selectedDayBookings.length} รายการ)</span>
                </h4>
              </div>
              ${canBookSelectedDay ? `
                <button type="button" onclick="quickBookFromDate('${state.dashboardType}', '${selectedYmd}')"
                  class="self-start sm:self-auto px-4 py-2 rounded-xl ${isRoom ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-sky-600 hover:bg-sky-700'} text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
                  <i data-lucide="plus-circle" class="w-4 h-4"></i>
                  จอง${isRoom ? 'ห้องประชุม' : 'รถราชการ'}วันนี้เลย
                </button>
              ` : `<span class="text-xs text-slate-400">วันที่ผ่านมาแล้ว</span>`}
            </div>

            ${selectedDayBookings.length === 0 ? `
              <div class="bg-white rounded-2xl border border-emerald-200/80 p-5 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                  <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                </div>
                <div>
                  <p class="text-sm font-semibold text-emerald-900">ว่างตลอดทั้งวัน</p>
                  <p class="text-xs text-slate-500">ยังไม่มีรายการจอง${isRoom ? 'ห้องประชุม' : 'รถราชการ'}ในวันที่เลือก สามารถกดปุ่มจองด้านบนได้ทันที</p>
                </div>
              </div>
            ` : `
              <div class="space-y-2.5">
                ${selectedDayBookings.map(b => renderScheduleCard(state.dashboardType, b)).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderScheduleCard(type, b) {
      const isRoom = type === 'room';
      return `
        <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="space-y-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold ${isRoom ? 'bg-indigo-50 text-indigo-700' : 'bg-sky-50 text-sky-700'}">
                ${isRoom ? esc(b.Room_Name) : `${esc(b.Vehicle_Name)} (${esc(b.Plate_Number)})`}
              </span>
              ${bookingStatusBadge(b.Status)}
            </div>
            <p class="font-semibold text-sm text-slate-900 truncate">

    function bookingStatusBadge(status) {

        : '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-rose-50 text-rose-700 shrink-0">งดใช้/ซ่อม</span>';
    }

    // ========================================================================
    // 8. PAGE 2: BOOK ROOM (จองห้องประชุม + ตรวจเวลาว่างเรียลไทม์)
    // ========================================================================
    function getRoomConflict(roomId, dateStr, startTime, endTime) {
      if (!roomId || !dateStr || !startTime || !endTime) return null;
      const reqStart = toTimestamp(dateStr, startTime);
      const reqEnd = toTimestamp(dateStr, endTime);
      if (reqEnd <= reqStart) return { invalidTime: true };

      return state.roomBookings.find(b => {
        if (b.Room_ID !== roomId) return false;
        if (b.Status === 'Rejected' || b.Status === 'Cancelled') return false;
        if (b.Booking_Date !== dateStr) return false;
        return isTimeOverlap(reqStart, reqEnd, toTimestamp(b.Booking_Date, b.Start_Time), toTimestamp(b.Booking_Date, b.End_Time));
      }) || null;
    }

    function renderBookRoomPage() {

                  onchange="updateRoomForm('bookingDate', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">เวลาเริ่มต้น <span class="text-rose-500">*</span></label>

                  onchange="updateRoomForm('startTime', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">เวลาสิ้นสุด <span class="text-rose-500">*</span></label>
                <input type="time" value="${f.endTime}"
                  onchange="updateRoomForm('endTime', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm" />

            <!-- แจ้งเตือนสถานะเวลา -->

            ` : `
              <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <div>
                  <p class="font-bold">ห้องประชุมไม่ว่างในช่วงเวลานี้!</p>
                  <p class="mt-0.5">ถูกจองแล้วโดย <b>${esc(conflict.Requester_Name)}</b> เรื่อง "${esc(conflict.Title)}" เวลา ${conflict.Start_Time} - ${conflict.End_Time} น.</p>

              </div>

                  <label class="block text-xs font-bold text-slate-700 mb-1">รูปแบบการจัดโต๊ะ</label>

              <div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${equipOptions.map(eq => {
                    const checked = f.equipment.includes(eq);
                    return `
                      <label class="flex items-center gap-2.5 p-2.5 rounded-xl border ${checked ? 'border-indigo-300 bg-indigo-50/40' : 'border-slate-200'} cursor-pointer text-xs">

                          class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500" />
    function applyWorkspaceData(data) {
      state.user = { ...data.user };
      state.realRole = data.user.role;
      if (state.realRole === 'Admin' && state.previewRole) {
        state.user.role = state.previewRole;
      }
      state.rooms = data.rooms || [];
      state.vehicles = data.vehicles || [];
      state.drivers = data.drivers || [];
      state.roomBookings = data.roomBookings || [];
      state.vehicleBookings = data.vehicleBookings || [];
      state.users = data.users || [];

      if (!state.roomForm.roomId) {
        const activeRoom = state.rooms.find(r => r.Status === 'Active');
        if (activeRoom) state.roomForm.roomId = activeRoom.Room_ID;
      }
      if (!state.vehicleForm.vehicleId) {
        const activeVeh = state.vehicles.find(v => v.Status === 'Active');
        if (activeVeh) state.vehicleForm.vehicleId = activeVeh.Vehicle_ID;
      }

      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('registerScreen').classList.add('hidden');
      document.getElementById('mainShell').classList.remove('hidden');
      document.getElementById('mobileBottomNav').classList.remove('hidden');

      updateUserProfileUI();
      renderNavigation();
      renderCurrentPage();
    }

    function syncCurrentStateToCache() {
      if (!state.lineProfile.userId || !state.user) return;
      saveLocalCache(state.lineProfile.userId, {
        status: 'success',
        user: { ...state.user, role: state.realRole || state.user.role },
        rooms: state.rooms,
        vehicles: state.vehicles,
        drivers: state.drivers,
        roomBookings: state.roomBookings,
        vehicleBookings: state.vehicleBookings,
        users: state.users
      });
    }

    async function loadWorkspaceData(showNotification = false) {
      const data = await apiGet({
        action: 'getBootstrapData',
        userId: state.lineProfile.userId
      });

      if (data.status === 'unregistered') {
        try { localStorage.removeItem(getCacheKey(state.lineProfile.userId)); } catch (e) {}
        showRegisterScreen();
        return;
      }

      if (data.status !== 'success') {
        throw new Error(data.message || 'โหลดข้อมูลไม่สำเร็จ');
      }

      saveLocalCache(state.lineProfile.userId, data);
      applyWorkspaceData(data);

      if (showNotification) {
        showToast('อัปเดตข้อมูลล่าสุดเรียบร้อยแล้ว', 'success');
      }
    }

    async function refreshData(notify = false, silent = false) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin');
      try {
        await loadWorkspaceData(notify);
      } catch (e) {
        if (!silent) showToast('รีเฟรชข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error');
      } finally {
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    // ========================================================================
    // 9. PAGE 3: BOOK VEHICLE (จองรถราชการ + ตรวจคิวรถและคนขับ)
    // ========================================================================
    function getVehicleConflict(vehicleId, startDate, startTime, endDate, endTime) {
      if (!vehicleId || !startDate || !endDate) return null;
      const reqStart = toTimestamp(startDate, startTime);
      const reqEnd = toTimestamp(endDate, endTime);
      if (reqEnd <= reqStart) return { invalidTime: true };

      return state.vehicleBookings.find(b => {
        if (b.Vehicle_ID !== vehicleId) return false;
        if (b.Status === 'Rejected' || b.Status === 'Cancelled') return false;
        return isTimeOverlap(reqStart, reqEnd, toTimestamp(b.Start_Date, b.Start_Time), toTimestamp(b.End_Date, b.End_Time));
      }) || null;
    }

        { value: 'ใช้ตามสภาพเดิมของห้อง (ปกติ)', label: 'ตามสภาพเดิมของห้อง', desc: 'ไม่ต้องเคลื่อนย้ายโต๊ะและเก้าอี้', icon: 'check-square' }

                </div>
                <input type="text" value="${esc(f.seatingDetail || '')}" oninput="state.roomForm.seatingDetail = this.value"

    async function submitRoomBooking() {
      if (state.isSubmitting) return;
      const f = state.roomForm;
      if (!f.roomId || !f.bookingDate || !f.title.trim()) {
        showToast('กรุณาเลือกห้องประชุม วันที่ และกรอกหัวข้อการประชุมให้ครบถ้วน', 'warning');
        return;
      }
      if (getRoomConflict(f.roomId, f.bookingDate, f.startTime, f.endTime)) {
        showToast('ห้องประชุมไม่ว่างในช่วงเวลาที่เลือก', 'error');
        return;
      }

      const combinedSeating = (f.seatingDetail && f.seatingDetail.trim())
        ? `${f.seatingStyle} (${f.seatingDetail.trim()})`
        : f.seatingStyle;

      state.isSubmitting = true;
      renderCurrentPage();
      try {
        const res = await apiPost({
          action: 'createRoomBooking',
          userId: state.user.userId,
          roomId: f.roomId,
          bookingDate: f.bookingDate,
          startTime: f.startTime,
          endTime: f.endTime,
          title: f.title.trim(),
          attendees: Number(f.attendees || 0),
          seatingStyle: combinedSeating,
          equipment: f.equipment,
          note: f.note.trim()
        });

        if (res.status === 'success') {
          showToast(`ส่งคำขอจองเรียบร้อย (${res.bookingId})`, 'success');
          state.roomForm.title = '';
          state.roomForm.seatingDetail = '';
          state.roomForm.note = '';
          if (res.booking) {
            state.roomBookings = [res.booking, ...state.roomBookings.filter(b => b.Booking_ID !== res.booking.Booking_ID)];
            syncCurrentStateToCache();
          } else {
            await loadWorkspaceData(false);
          }
          switchTab('my-bookings');
        } else if (res.status === 'conflict') {
          if (Array.isArray(res.roomBookings)) {
            state.roomBookings = res.roomBookings;
            syncCurrentStateToCache();
          }
          showToast(res.message || 'มีผู้อื่นจองช่วงเวลานี้ไปแล้ว กรุณาเลือกเวลาใหม่', 'error');
        } else {
          showToast(res.message || 'ไม่สามารถบันทึกการจองได้', 'error');
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      } finally {
        state.isSubmitting = false;
        renderCurrentPage();
      }
    }

    async function executeCancelBooking(bookingType, bookingId) {
      if (state.isProcessingAction) return;
      state.isProcessingAction = true;
      closeModal();
      showToast('กำลังยกเลิกรายการ...', 'info');
      try {
        const res = await apiPost({
          action: 'cancelBooking',
          userId: state.user.userId,
          bookingType,
          bookingId
        });
        if (res.status === 'success') {
          showToast(res.message, 'success');
          const list = bookingType === 'room' ? state.roomBookings : state.vehicleBookings;
          const target = list.find(x => x.Booking_ID === bookingId);
          if (target) target.Status = 'Cancelled';
          syncCurrentStateToCache();
          renderNavigation();
          renderCurrentPage();
        } else {

    function buildExternalPrintUrl(type, b) {
      const compact = type === 'room'
        ? {
            t: 'room',
            Booking_ID: b.Booking_ID,
            Room_Name: b.Room_Name,
            Department: b.Department,
            Booking_Date: b.Booking_Date,
            Start_Time: b.Start_Time,
            End_Time: b.End_Time,
            Requester_Name: b.Requester_Name,
            Phone: b.Phone,
            Title: b.Title,
            Attendees: b.Attendees,
            Seating_Style: b.Seating_Style,
            Equipment_JSON: b.Equipment_JSON,
            Note: b.Note,
            Status: b.Status,
            Approver_Name: b.Approver_Name,
            Reject_Reason: b.Reject_Reason
          }
        : {
            t: 'vehicle',
            Booking_ID: b.Booking_ID,
            Doc_Ref: b.Doc_Ref,
            Vehicle_Name: b.Vehicle_Name,
            Plate_Number: b.Plate_Number,
            Department: b.Department,
            Start_Date: b.Start_Date,
            Start_Time: b.Start_Time,
            End_Date: b.End_Date,
            End_Time: b.End_Time,
            Requester_Name: b.Requester_Name,
            Phone: b.Phone,
            Purpose: b.Purpose,
            Destination: b.Destination,
            Province: b.Province,
            Teacher_Count: b.Teacher_Count,
            Student_Count: b.Student_Count,
            Driver_Name: b.Driver_Name,
            Note: b.Note,
            Status: b.Status,
            Approver_Name: b.Approver_Name,
            Reject_Reason: b.Reject_Reason
          };
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}#print=${encodePrintPayload(compact)}`;
    }

    function openExternalPrintPage(type, bookingId) {
      const isRoom = type === 'room';
      const b = isRoom
        ? state.roomBookings.find(x => x.Booking_ID === bookingId)
        : state.vehicleBookings.find(x => x.Booking_ID === bookingId);
      if (!b) return;

      const printUrl = buildExternalPrintUrl(type, b);
      try {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
          liff.openWindow({ url: printUrl, external: true });
        } else {
          window.open(printUrl, '_blank');
        }
      } catch (e) {
        window.open(printUrl, '_blank');
      }
    }

                    <p class="text-slate-600">กลับ: ${formatThaiDateShort(v.End_Date)} ${v.End_Time} น. • คนขับ: <b>${esc(v.Driver_Name)}</b></p>
                    <p class="text-slate-600">ผู้โดยสาร: ครู ${v.Teacher_Count || 0} / นร. ${v.Student_Count || 0} คน</p>
                    ${v.Note ? `<p class="text-slate-600">หมายเหตุ: ${esc(v.Note)}</p>` : ''}
                    <p class="text-slate-500">ผู้ขอใช้: ${esc(v.Requester_Name)} (<a href="tel:${esc(v.Phone)}" class="text-sky-600 underline">${esc(v.Phone)}</a>)</p>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ========================================================================
    // 13. PAGE 7: ADMIN SETTINGS (จัดการห้องประชุม / รถ / คนขับ / สิทธิ์บุคลากร)
    // ========================================================================
    function renderAdminPage() {
      const tabs = [
        { id: 'rooms', label: `ห้องประชุม (${state.rooms.length})`, icon: 'building-2' },
        { id: 'vehicles', label: `รถราชการ (${state.vehicles.length})`, icon: 'bus' },
        { id: 'drivers', label: `คนขับรถ (${state.drivers.length})`, icon: 'user-check' },
        { id: 'users', label: `บุคลากร/สิทธิ์ (${state.users.length})`, icon: 'users' }
      ];

      let contentHtml = '';
      if (state.adminTab === 'rooms') {
        contentHtml = `
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-bold text-sm text-slate-800">รายการห้องประชุมทั้งหมด</h3>
            <button onclick="openRoomModal()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มห้องประชุม
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${state.rooms.map(r => `
              <div class="p-4 rounded-2xl border border-slate-200/80 bg-slate-50/60 flex items-start justify-between gap-3">
                <div class="space-y-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-slate-900 truncate">${esc(r.Room_Name)}</span>
                    ${resourceStatusBadge(r.Status)}
                  </div>
                  <p class="text-xs text-slate-500">${esc(r.Building)} • จุ ${r.Capacity} คน</p>
                  <p class="text-[11px] text-slate-400">${esc(r.Amenities)}</p>
                </div>
                <button onclick="openRoomModal('${r.Room_ID}')" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 shrink-0">
                  แก้ไข
                </button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (state.adminTab === 'vehicles') {
        contentHtml = `
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-bold text-sm text-slate-800">รายการรถราชการทั้งหมด</h3>
            <button onclick="openVehicleModal()" class="px-3.5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มรถราชการ
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${state.vehicles.map(v => `
              <div class="p-4 rounded-2xl border border-slate-200/80 bg-slate-50/60 flex items-start justify-between gap-3">
                <div class="space-y-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-slate-900 truncate">${esc(v.Vehicle_Name)}</span>
                    ${resourceStatusBadge(v.Status)}
                  </div>
                  <p class="text-xs text-slate-500">ทะเบียน ${esc(v.Plate_Number)} • ${v.Seats} ที่นั่ง</p>
                  <p class="text-[11px] text-slate-400">ประเภท: ${esc(v.Vehicle_Type)}</p>
                </div>
                <button onclick="openVehicleModal('${v.Vehicle_ID}')" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 shrink-0">
                  แก้ไข
                </button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (state.adminTab === 'drivers') {
        contentHtml = `
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-bold text-sm text-slate-800">รายชื่อพนักงานขับรถ</h3>
            <button onclick="openDriverModal()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มพนักงานขับรถ
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${state.drivers.map(d => `
              <div class="p-4 rounded-2xl border border-slate-200/80 bg-slate-50/60 flex items-start justify-between gap-3">
                <div class="space-y-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-slate-900 truncate">${esc(d.Driver_Name)}</span>
                    ${resourceStatusBadge(d.Status)}
                  </div>
                  <p class="text-xs text-slate-500">โทร: ${esc(d.Phone || '-')}</p>
                  <p class="text-[11px] text-slate-400 truncate">LINE ID: ${esc(d.Line_User_ID || 'ยังไม่ผูก (ให้พิมพ์ "เช็กไอดี" ในบอท)')}</p>
                </div>
                <button onclick="openDriverModal('${d.Driver_ID}')" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 shrink-0">
                  แก้ไข
                </button>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        contentHtml = `
          <div class="space-y-2">
            <h3 class="font-bold text-sm text-slate-800">จัดการสิทธิ์บุคลากรในโรงเรียน</h3>
            <p class="text-xs text-slate-500">กำหนดสิทธิ์ Approver ให้ ผอ./รอง ผอ. เพื่อรับแจ้งเตือนและอนุมัติคำขอผ่าน LINE</p>
          </div>
          <div class="space-y-2.5">
            ${state.users.map(u => `
              <div class="p-3.5 rounded-2xl border border-slate-200/80 bg-slate-50/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="min-w-0">
                  <p class="font-bold text-sm text-slate-900 truncate">${esc(u.fullName)}</p>
                  <p class="text-xs text-slate-500 truncate">${esc(u.position)} • ${esc(u.department)} • ${esc(u.phone || '-')}</p>
                </div>
                <select onchange="changeUserRole('${u.userId}', this.value)"
                  class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-semibold text-slate-700 outline-none shrink-0">
                  <option value="Teacher" ${u.role === 'Teacher' ? 'selected' : ''}>ครู/บุคลากร (Teacher)</option>
                  <option value="Approver" ${u.role === 'Approver' ? 'selected' : ''}>ผู้อนุมัติ (Approver)</option>
                  <option value="AV_Staff" ${u.role === 'AV_Staff' ? 'selected' : ''}>จนท.โสตฯ (AV_Staff)</option>
                  <option value="Driver" ${u.role === 'Driver' ? 'selected' : ''}>พนักงานขับรถ (Driver)</option>
                  <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>ผู้ดูแลระบบ (Admin)</option>
                </select>
              </div>
            `).join('')}
          </div>
        `;
      }

      return `
        <div class="space-y-4 fade-in">
          <div class="bg-white p-2 rounded-2xl border border-slate-200/80 shadow-sm flex flex-wrap gap-1.5">
            ${tabs.map(t => `
              <button onclick="state.adminTab='${t.id}'; renderCurrentPage();"
                class="flex-1 min-w-[120px] px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
                  state.adminTab === t.id ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                }">
                <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i>
                <span>${t.label}</span>
              </button>
            `).join('')}
          </div>

          <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-5 space-y-4">
            ${contentHtml}
          </div>
        </div>
      `;
    }

    function openRoomModal(roomId = '') {
      const r = state.rooms.find(x => x.Room_ID === roomId) || {
        Room_ID: '', Room_Name: '', Building: '', Capacity: 30, Amenities: '', Status: 'Active', Color: '#4f46e5'
      };
      openModal(`
        <div class="p-6 space-y-4 overflow-y-auto">
          <h3 class="font-bold text-base text-slate-900">${r.Room_ID ? 'แก้ไขห้องประชุม' : 'เพิ่มห้องประชุมใหม่'}</h3>
          <div class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">ชื่อห้องประชุม *</label>
              <input id="rmName" value="${esc(r.Room_Name)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">อาคาร/ชั้น</label>
                <input id="rmBuilding" value="${esc(r.Building)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">ความจุ (คน)</label>
                <input id="rmCapacity" type="number" value="${esc(r.Capacity)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">อุปกรณ์ประจำห้อง</label>
              <input id="rmAmenities" value="${esc(r.Amenities)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">สถานะ</label>
              <select id="rmStatus" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                <option value="Active" ${r.Status === 'Active' ? 'selected' : ''}>พร้อมใช้งาน (Active)</option>
                <option value="Maintenance" ${r.Status !== 'Active' ? 'selected' : ''}>งดใช้/ซ่อมบำรุง (Maintenance)</option>
              </select>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">ยกเลิก</button>
            <button onclick="saveRoom('${r.Room_ID}')" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">บันทึก</button>
          </div>
        </div>
      `);
    }

    async function saveRoom(roomId) {
      const name = document.getElementById('rmName').value.trim();
      if (!name) { showToast('กรุณากรอกชื่อห้องประชุม', 'warning'); return; }
      closeModal();
      showToast('กำลังบันทึกข้อมูลห้องประชุม...', 'info');
      const res = await apiPost({
        action: 'saveResource',
        userId: state.user.userId,
        resourceType: 'room',
        data: {
          Room_ID: roomId,
          Room_Name: name,
          Building: document.getElementById('rmBuilding').value.trim(),
          Capacity: Number(document.getElementById('rmCapacity').value || 0),
          Amenities: document.getElementById('rmAmenities').value.trim(),
          Status: document.getElementById('rmStatus').value
        }
      });
      if (res.status === 'success') {
        showToast(res.message, 'success');
        await loadWorkspaceData(false);
      } else {
        showToast(res.message || 'บันทึกไม่สำเร็จ', 'error');
      }
    }

    function openVehicleModal(vehicleId = '') {
      const v = state.vehicles.find(x => x.Vehicle_ID === vehicleId) || {
        Vehicle_ID: '', Vehicle_Name: '', Plate_Number: '', Vehicle_Type: 'รถตู้', Seats: 12, Status: 'Active', Color: '#0ea5e9'
      };
      openModal(`
        <div class="p-6 space-y-4 overflow-y-auto">
          <h3 class="font-bold text-base text-slate-900">${v.Vehicle_ID ? 'แก้ไขข้อมูลรถราชการ' : 'เพิ่มรถราชการใหม่'}</h3>
          <div class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">ชื่อรถ / รุ่น *</label>
              <input id="vhName" value="${esc(v.Vehicle_Name)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">หมายเลขทะเบียน *</label>
                <input id="vhPlate" value="${esc(v.Plate_Number)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">จำนวนที่นั่ง</label>
                <input id="vhSeats" type="number" value="${esc(v.Seats)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">ประเภทรถ</label>
                <input id="vhType" value="${esc(v.Vehicle_Type)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">สถานะ</label>
                <select id="vhStatus" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                  <option value="Active" ${v.Status === 'Active' ? 'selected' : ''}>พร้อมใช้งาน</option>
                  <option value="Maintenance" ${v.Status !== 'Active' ? 'selected' : ''}>งดใช้/ซ่อมบำรุง</option>
                </select>
              </div>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">ยกเลิก</button>
            <button onclick="saveVehicle('${v.Vehicle_ID}')" class="px-5 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">บันทึก</button>
          </div>
        </div>
      `);
    }

    async function saveVehicle(vehicleId) {
      const name = document.getElementById('vhName').value.trim();
      const plate = document.getElementById('vhPlate').value.trim();
      if (!name || !plate) { showToast('กรุณากรอกชื่อรถและทะเบียนรถ', 'warning'); return; }
      closeModal();
      showToast('กำลังบันทึกข้อมูลรถราชการ...', 'info');
      const res = await apiPost({
        action: 'saveResource',
        userId: state.user.userId,
        resourceType: 'vehicle',
        data: {
          Vehicle_ID: vehicleId,
          Vehicle_Name: name,
          Plate_Number: plate,
          Vehicle_Type: document.getElementById('vhType').value.trim(),
          Seats: Number(document.getElementById('vhSeats').value || 0),
          Status: document.getElementById('vhStatus').value
        }
      });
      if (res.status === 'success') {
        showToast(res.message, 'success');
        await loadWorkspaceData(false);
      } else {
        showToast(res.message || 'บันทึกไม่สำเร็จ', 'error');
      }
    }

    function openDriverModal(driverId = '') {
      const d = state.drivers.find(x => x.Driver_ID === driverId) || {
        Driver_ID: '', Driver_Name: '', Phone: '', Line_User_ID: '', Status: 'Active'
      };
      openModal(`
        <div class="p-6 space-y-4 overflow-y-auto">
          <h3 class="font-bold text-base text-slate-900">${d.Driver_ID ? 'แก้ไขพนักงานขับรถ' : 'เพิ่มพนักงานขับรถใหม่'}</h3>
          <div class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">ชื่อ-นามสกุล *</label>
              <input id="drName" value="${esc(d.Driver_Name)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">เบอร์โทรศัพท์</label>
              <input id="drPhone" value="${esc(d.Phone)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">LINE User ID (สำหรับรับแจ้งเตือนคิวขับรถ)</label>
              <input id="drLineId" value="${esc(d.Line_User_ID)}" placeholder="ให้คนขับพิมพ์ 'เช็กไอดี' ในแชทบอทแล้วนำมาวาง" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">สถานะ</label>
              <select id="drStatus" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                <option value="Active" ${d.Status === 'Active' ? 'selected' : ''}>ปฏิบัติงานปกติ</option>
                <option value="Inactive" ${d.Status !== 'Active' ? 'selected' : ''}>พักงาน/ไม่ว่าง</option>
              </select>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">ยกเลิก</button>
            <button onclick="saveDriver('${d.Driver_ID}')" class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">บันทึก</button>
          </div>
        </div>
      `);
    }

    async function saveDriver(driverId) {
      const name = document.getElementById('drName').value.trim();
      if (!name) { showToast('กรุณากรอกชื่อพนักงานขับรถ', 'warning'); return; }
      closeModal();
      showToast('กำลังบันทึกข้อมูลพนักงานขับรถ...', 'info');
      const res = await apiPost({
        action: 'saveResource',
        userId: state.user.userId,
        resourceType: 'driver',
        data: {
          Driver_ID: driverId,
          Driver_Name: name,
          Phone: document.getElementById('drPhone').value.trim(),
          Line_User_ID: document.getElementById('drLineId').value.trim(),
          Status: document.getElementById('drStatus').value
        }
      });
      if (res.status === 'success') {
        showToast(res.message, 'success');
        await loadWorkspaceData(false);
      } else {
        showToast(res.message || 'บันทึกไม่สำเร็จ', 'error');
      }
    }

    async function changeUserRole(targetUserId, newRole) {
      showToast('กำลังอัปเดตสิทธิ์บุคลากร...', 'info');
      try {
        const res = await apiPost({
          action: 'updateUserRole',
          userId: state.user.userId,
          targetUserId,
          newRole
        });
        if (res.status === 'success') {
          showToast(res.message, 'success');
          const target = state.users.find(u => u.userId === targetUserId);
          if (target) target.role = newRole;
          syncCurrentStateToCache();
        } else {
          showToast(res.message || 'อัปเดตสิทธิ์ไม่สำเร็จ', 'error');
          await loadWorkspaceData(false);
        }
      } catch (e) {
        showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
      }
    }

    // ========================================================================
    // 14. START APPLICATION
    // ========================================================================
    initApp();
  </script>
</body>
</html>
